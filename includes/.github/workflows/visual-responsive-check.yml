name: SEO System Visual Responsive Check

on:
  workflow_dispatch:
    inputs:
      callback_url:
        description: Private WordPress callback URL
        required: true
        type: string
      callback_token:
        description: Temporary callback token
        required: true
        type: string
      run_id:
        description: SEO System visual run id
        required: true
        type: string
      urls_b64:
        description: Base64 encoded JSON map of URLs
        required: true
        type: string

permissions:
  contents: read

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Run responsive audit
        env:
          SEO_VISUAL_CALLBACK_URL: ${{ inputs.callback_url }}
          SEO_VISUAL_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          SEO_VISUAL_RUN_ID: ${{ inputs.run_id }}
          SEO_VISUAL_URLS_B64: ${{ inputs.urls_b64 }}
          SEO_VISUAL_GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/visual-responsive-check.py

      - name: Upload screenshots and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-system-visual-${{ inputs.run_id }}
          path: visual-artifacts/
          if-no-files-found: ignore
          retention-days: 14
