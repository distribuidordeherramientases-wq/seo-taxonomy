name: One-time modular TaxoCommerce legacy-artifact cleanup (STAGING and PRO)

# Trigger only on the authorised cleanup merge. Never run the standard PRO
# deployment: that updates the legacy seo-taxonomy monolith as well.
on:
  pull_request:
    branches: [staging]
    paths:
      - '.github/workflows/cleanup-taxocommerce-family-once.yml'
      - '.github/scripts/cleanup_taxocommerce_family_ftp.py'
      - '.github/scripts/tests/test_cleanup_taxocommerce_family_ftp.py'
      - '.github/workflows/deploy-staging.yml'
  push:
    branches: [staging]
    paths:
      - '.github/workflows/cleanup-taxocommerce-family-once.yml'
      - '.github/scripts/cleanup_taxocommerce_family_ftp.py'
      - '.github/scripts/tests/test_cleanup_taxocommerce_family_ftp.py'
      - '.github/workflows/deploy-staging.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: taxocommerce-family-legacy-cleanup-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax and safe cleanup invariants
        run: |
          python3 -m py_compile .github/scripts/cleanup_taxocommerce_family_ftp.py
          python3 -m py_compile .github/scripts/tests/test_cleanup_taxocommerce_family_ftp.py
          python3 -m unittest discover -s .github/scripts/tests -p 'test_cleanup_taxocommerce_family_ftp.py' -v
      - name: Verify no standalone module deploy keeps FTP state inside plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('.github/workflows/deploy-staging.yml').read_text()
          for block in re.split(r'(?=      - name: )', s):
              if 'local-dir: ./taxocommerce-' not in block:
                  continue
              module = re.search(r'local-dir: ./((?:taxocommerce-)[a-z-]+)/', block)
              assert module, 'Missing module slug'
              expected = 'state-name: ../.' + module.group(1) + '-ftp-state.json'
              assert block.count('state-name:') == 1, module.group(1) + ' has duplicate or missing FTP state'
              assert expected in block, module.group(1) + ' stores FTP state inside its plugin'
              assert 'tests/**' in block or '**/tests/**' in block, module.group(1) + ' deploys test files'
          assert "if: ${{ !contains(github.event.head_commit.message, '[family-cleanup-20261031]') }}" in s
          print('Only standalone TaxoCommerce FTP states are external; monolith protected during this run.')
          PY

  clean-staging:
    needs: validate
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[family-cleanup-20261031]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and back up STAGING obsolete modular files
        env:
          TC_FAMILY_FTP_HOST: ${{ secrets.STAGING_FTP_SERVER }}
          TC_FAMILY_FTP_USER: ${{ secrets.STAGING_FTP_USERNAME }}
          TC_FAMILY_FTP_PASS: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: python3 .github/scripts/cleanup_taxocommerce_family_ftp.py plan
      - name: Persist STAGING backups BEFORE any deletion
        uses: actions/upload-artifact@v4
        with:
          name: taxocommerce-family-staging-obsolete-files-backup
          path: .family-module-cleanup/
          retention-days: 14
          if-no-files-found: error
      - name: Remove only verified STAGING test and FTP-state files
        env:
          TC_FAMILY_FTP_HOST: ${{ secrets.STAGING_FTP_SERVER }}
          TC_FAMILY_FTP_USER: ${{ secrets.STAGING_FTP_USERNAME }}
          TC_FAMILY_FTP_PASS: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          python3 .github/scripts/cleanup_taxocommerce_family_ftp.py apply
          python3 .github/scripts/cleanup_taxocommerce_family_ftp.py verify

  clean-production:
    needs: validate
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[family-cleanup-20261031]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and back up PRO obsolete modular files
        env:
          TC_FAMILY_FTP_HOST: ${{ secrets.FTP_SERVER }}
          TC_FAMILY_FTP_USER: ${{ secrets.FTP_USERNAME }}
          TC_FAMILY_FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/cleanup_taxocommerce_family_ftp.py plan
      - name: Persist PRO backups BEFORE any deletion
        uses: actions/upload-artifact@v4
        with:
          name: taxocommerce-family-pro-obsolete-files-backup
          path: .family-module-cleanup/
          retention-days: 14
          if-no-files-found: error
      - name: Remove only verified PRO test and FTP-state files
        env:
          TC_FAMILY_FTP_HOST: ${{ secrets.FTP_SERVER }}
          TC_FAMILY_FTP_USER: ${{ secrets.FTP_USERNAME }}
          TC_FAMILY_FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 .github/scripts/cleanup_taxocommerce_family_ftp.py apply
          python3 .github/scripts/cleanup_taxocommerce_family_ftp.py verify
      - name: Record production cleanup result on issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 1918 --body "PRO family cleanup verified: obsolete files removed from taxocommerce-* modules only; tests and FTP state were backed up in the Actions artifact. Legacy seo-taxonomy plugin was not accessed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Repeat WordPress Plugin Check in PRO to confirm."
