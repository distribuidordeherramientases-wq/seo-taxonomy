name: Deploy TaxoCommerce Core to STAGING

on:
  push:
    branches:
      - taxocommerce-core-staging
      - staging
    paths:
      - 'taxocommerce-core/**'
      - '.github/workflows/deploy-taxocommerce-core-staging.yml'
      - '.github/scripts/cleanup_taxocommerce_core_ftp_artifacts.py'
      - '.github/scripts/tests/test_cleanup_taxocommerce_core_ftp_artifacts.py'
  pull_request:
    branches:
      - staging
    paths:
      - 'taxocommerce-core/**'
      - '.github/workflows/deploy-taxocommerce-core-staging.yml'
      - '.github/scripts/cleanup_taxocommerce_core_ftp_artifacts.py'
      - '.github/scripts/tests/test_cleanup_taxocommerce_core_ftp_artifacts.py'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core branch
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP lint
        run: find taxocommerce-core -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate Core FTPS cleanup Python syntax
        run: python3 -m py_compile .github/scripts/cleanup_taxocommerce_core_ftp_artifacts.py

      - name: Test Core FTPS legacy-artifact cleanup (offline)
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_cleanup_taxocommerce_core_ftp_artifacts.py' -v

      - name: Verify standalone Core installable ZIP has no tests or hidden files
        run: |
          set -euo pipefail
          test -d taxocommerce-core/tests
          test -f taxocommerce-core/taxocommerce-core.php
          test -f taxocommerce-core/readme.txt
          mkdir -p build/taxocommerce-core
          rsync -a --exclude='tests/' --exclude='.*' --exclude='*.bak' \
            taxocommerce-core/ build/taxocommerce-core/
          python3 - <<'PY'
          from pathlib import Path
          plugin = Path('build/taxocommerce-core')
          source = Path('taxocommerce-core')
          assert (plugin / 'taxocommerce-core.php').is_file()
          assert (plugin / 'readme.txt').is_file()
          assert (source / 'tests' / 'editorial-guide-smoke.php').is_file()
          assert (source / 'tests' / 'menu-editor-smoke.php').is_file()
          assert (source / 'tests' / 'anomalies-smoke.php').is_file()
          assert (source / 'tests' / 'modular-architecture-smoke.php').is_file()
          bad = [str(p) for p in plugin.rglob('*')
                 if p.name.startswith('.') or 'tests' in p.relative_to(plugin).parts]
          if bad:
              raise SystemExit('Development artifacts included in Core package: ' + str(bad))
          print('Core package clean: no hidden files or development tests; CI tests remain in repository.')
          PY
          ( cd build && zip -qr "${RUNNER_TEMP}/taxocommerce-core-installable.zip" taxocommerce-core )
          unzip -t "${RUNNER_TEMP}/taxocommerce-core-installable.zip"

      - name: Verify SEO architecture report before deploy
        run: php taxocommerce-core/tests/architecture-report-smoke.php

      - name: Verify Core content inventory before deploy
        run: php taxocommerce-core/tests/content-inventory-smoke.php

      - name: Validate User Guide integration
        run: php taxocommerce-core/tests/user-guide-smoke.php

      - name: Validate Extensions cards on Core home
        run: php taxocommerce-core/tests/extensions-dashboard-smoke.php

      - name: Validate Redirects Open link in Core extension catalogue
        run: |
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php standalone
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php core-before
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php core-after

      - name: Validate canonical SEO relation and role tables
        run: |
          test -f taxocommerce-core/includes/class-taxocommerce-core-hierarchy-classic.php
          grep -q "seo_relations" taxocommerce-core/includes/class-taxocommerce-core-hierarchy-classic.php
          grep -q "seo_nodes" taxocommerce-core/includes/class-taxocommerce-core-hierarchy-classic.php
          # SQL access is required for the shared structural tables.
          # WordPress database placeholders, nonce checks and capabilities
          # are validated through code review and the PHP lint step.

  deploy:
    name: Deploy Core plugin to STAGING
    needs: validate
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[staging-clean-three-20261031]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core branch
        uses: actions/checkout@v4

      - name: Deploy TaxoCommerce Core
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./taxocommerce-core/
          server-dir: ./wp-content/plugins/taxocommerce-core/
          # Store FTP sync state outside the installed plugin directory.
          state-name: ../.taxocommerce-core-standalone-ftp-state.json
          dry-run: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            **/tests/**
            .ftp-deploy-sync-state.json
            **/.ftp-deploy-sync-state.json
            **/*.bak

      - name: Remove obsolete Core test files and hidden FTP state from STAGING
        env:
          TC_CORE_FTP_HOST: ${{ secrets.STAGING_FTP_SERVER }}
          TC_CORE_FTP_USER: ${{ secrets.STAGING_FTP_USERNAME }}
          TC_CORE_FTP_PASS: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: python3 .github/scripts/cleanup_taxocommerce_core_ftp_artifacts.py

