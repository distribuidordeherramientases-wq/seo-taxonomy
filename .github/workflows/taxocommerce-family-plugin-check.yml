name: TaxoCommerce Family WordPress.org Readiness

# A change to this workflow intentionally selects all standalone TaxoCommerce modules.

on:
  workflow_dispatch:
  pull_request:
    branches: [staging]
    paths:
      - 'taxocommerce-*/**'
      - '.github/workflows/taxocommerce-family-plugin-check.yml'
      - '.github/scripts/taxocommerce_family_readme_check.py'
      - '.github/scripts/taxocommerce_family_scope.py'
      - '.github/scripts/taxocommerce_family_report.py'
      - '.github/scripts/tests/test_taxocommerce_family_report.py'
  push:
    branches: [staging]
    paths:
      - 'taxocommerce-*/**'
      - '.github/workflows/taxocommerce-family-plugin-check.yml'
      - '.github/scripts/taxocommerce_family_readme_check.py'
      - '.github/scripts/taxocommerce_family_scope.py'
      - '.github/scripts/taxocommerce_family_report.py'
      - '.github/scripts/tests/test_taxocommerce_family_report.py'

permissions:
  contents: read

jobs:
  discover-plugin-scope:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.scope.outputs.slugs }}
      count: ${{ steps.scope.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select standalone modules
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/taxocommerce_family_scope.py
      - name: Show scope
        run: echo "Selected ${{ steps.scope.outputs.count }} modules for independent Plugin Check"

  standalone-plugin-check:
    needs: discover-plugin-scope
    name: WordPress.org readiness / ${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slug: ${{ fromJSON(needs.discover-plugin-scope.outputs.slugs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build standalone distributable package
        shell: bash
        env:
          PLUGIN: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          mkdir -p "build/$PLUGIN"
          rsync -a \
            --exclude='tests/' \
            --exclude='.*' \
            --exclude='*.json.bak' \
            --exclude='README.md' \
            --exclude='*.bak' \
            --exclude='*.log' \
            "$PLUGIN/" "build/$PLUGIN/"
          test -f "build/$PLUGIN/$PLUGIN.php"
          test -f "build/$PLUGIN/readme.txt"
          find "build/$PLUGIN" -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          python3 .github/scripts/taxocommerce_family_readme_check.py "$PLUGIN" "build/$PLUGIN"
          ( cd build && zip -qr "../$PLUGIN.zip" "$PLUGIN" )
          # Distributable must never contain hidden FTP state, CI tests or other dotfiles.
          if unzip -Z1 "$PLUGIN.zip" | grep -E '(^|/)(tests/|[.][^/]+)'; then
            echo "::error title=$PLUGIN package::ZIP contains tests or hidden files"
            exit 1
          fi
          unzip -t "$PLUGIN.zip"
          bytes=$(stat -c%s "$PLUGIN.zip")
          if (( bytes > 10485760 )); then
            echo "::error title=$PLUGIN package::ZIP exceeds the 10 MiB submission limit: $bytes bytes"
            exit 1
          fi
          echo "ZIP size: $bytes bytes"

      - name: WordPress Plugin Check - strict, warnings visible
        id: plugin_check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/${{ matrix.slug }}
          slug: ${{ matrix.slug }}
          wp-version: latest
          ignore-warnings: false
          ignore-errors: false
          # Treat FAQ warnings as blocking without changing the policy for other modules.
          strict: ${{ matrix.slug == 'taxocommerce-faqs' }}

      - name: Record plugin quality result for consolidated report
        if: always()
        shell: bash
        env:
          PLUGIN: ${{ matrix.slug }}
          CHECK_OUTCOME: ${{ steps.plugin_check.outcome }}
        run: |
          python3 .github/scripts/taxocommerce_family_report.py scan \
            "$PLUGIN" "$RUNNER_TEMP/plugin-check-results.txt" \
            "$CHECK_OUTCOME" "$RUNNER_TEMP/quality-state.json"

      - name: Save findings in job summary
        if: always()
        shell: bash
        env:
          PLUGIN: ${{ matrix.slug }}
        run: |
          {
            echo "## $PLUGIN - WordPress Plugin Check"
            if test -f "$RUNNER_TEMP/plugin-check-results.txt"; then
              echo '\`\`\`text'
              head -c 20000 "$RUNNER_TEMP/plugin-check-results.txt"
              echo
              echo '\`\`\`'
            else
              echo 'Plugin Check report unavailable: inspect earlier steps.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload per-plugin report and test ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-readiness-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/plugin-check-results.txt
            ${{ runner.temp }}/quality-state.json
            ./${{ matrix.slug }}.zip
          retention-days: 14
          if-no-files-found: warn

  summarize-family:
    name: Resumen único de calidad de la familia
    needs: [discover-plugin-scope, standalone-plugin-check]
    if: always() && needs.discover-plugin-scope.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download independent plugin reports
        uses: actions/download-artifact@v4
        with:
          pattern: wordpress-readiness-*
          path: build/family-reports
          merge-multiple: false
      - name: Produce one consolidated summary and block unresolved warnings
        shell: bash
        env:
          EXPECTED_SLUGS: ${{ needs.discover-plugin-scope.outputs.slugs }}
        run: |
          set +e
          python3 .github/scripts/taxocommerce_family_report.py summary \
            build/family-reports "$EXPECTED_SLUGS" \
            build/family-reports/taxocommerce-family-summary.md
          result=$?
          if test -f build/family-reports/taxocommerce-family-summary.md; then
            cat build/family-reports/taxocommerce-family-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Save consolidated family report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxocommerce-family-plugin-check-summary
          path: build/family-reports/taxocommerce-family-summary.md
          retention-days: 14
          if-no-files-found: warn
