name: TaxoCommerce FAQs package and deployment

on:
  pull_request:
    branches: [staging]
    paths:
      - 'taxocommerce-faqs/**'
      - '.github/workflows/taxocommerce-faqs.yml'
  push:
    branches: [staging]
    paths:
      - 'taxocommerce-faqs/**'
      - '.github/workflows/taxocommerce-faqs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Syntax checks
        run: |
          test -f taxocommerce-faqs/taxocommerce-faqs.php
          test -f taxocommerce-faqs/uninstall.php
          find taxocommerce-faqs -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php taxocommerce-faqs/tests/admin-hook-smoke.php
          php taxocommerce-faqs/tests/auto-test-smoke.php
          php taxocommerce-faqs/tests/manual-smoke.php
          php taxocommerce-faqs/tests/lifecycle-smoke.php
          php taxocommerce-faqs/tests/lifecycle-smoke.php --cold-uninstall
      - name: Build ZIP (runtime only)
        run: |
          set -euo pipefail
          rm -rf build/taxocommerce-faqs
          mkdir -p build/taxocommerce-faqs
          rsync -a --exclude='tests/' --exclude='.*' --exclude='*.md' --exclude='*.bak' taxocommerce-faqs/ build/taxocommerce-faqs/
          test -f build/taxocommerce-faqs/taxocommerce-faqs.php
          test -f build/taxocommerce-faqs/includes/class-taxocommerce-faqs-auto-test.php
          test ! -e build/taxocommerce-faqs/tests
          if find build/taxocommerce-faqs -name '.*' -print -quit | grep -q .; then echo 'Hidden files in FAQ ZIP'; exit 1; fi
          ( cd build && zip -qr ../taxocommerce-faqs.zip taxocommerce-faqs )
          unzip -t taxocommerce-faqs.zip
      - uses: actions/upload-artifact@v4
        with:
          name: taxocommerce-faqs-${{ github.sha }}
          path: taxocommerce-faqs.zip
          retention-days: 30
  deploy:
    needs: package
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./taxocommerce-faqs/
          server-dir: ./wp-content/plugins/taxocommerce-faqs/
          dry-run: false
          log-level: verbose
          # Store sync state outside the installed FAQ plugin.
          state-name: ../.taxocommerce-faqs-ftp-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            **/*.bak
            **/*.md
            **/*.pot

      - name: Delete old FAQ test scripts and FTP state (STAGING only)
        env:
          TC_FAQ_FTP_HOST: ${{ secrets.STAGING_FTP_SERVER }}
          TC_FAQ_FTP_USER: ${{ secrets.STAGING_FTP_USERNAME }}
          TC_FAQ_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os

          ftp = ftplib.FTP_TLS(timeout=45)
          ftp.connect(os.environ['TC_FAQ_FTP_HOST'], 21)
          ftp.login(os.environ['TC_FAQ_FTP_USER'], os.environ['TC_FAQ_FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd('./wp-content/plugins/taxocommerce-faqs/')
          for name in (
              '.ftp-deploy-sync-state.json',
              'tests/admin-hook-smoke.php',
              'tests/lifecycle-smoke.php',
              'tests/auto-test-smoke.php',
              'tests/manual-smoke.php',
          ):
              try:
                  ftp.delete(name)
                  print('Removed obsolete FAQ artifact:', name)
              except ftplib.error_perm as exc:
                  if not str(exc).startswith('550'):
                      raise
          try:
              ftp.rmd('tests')
          except ftplib.error_perm as exc:
              if not str(exc).startswith('550'):
                  raise
          ftp.quit()
          PY
