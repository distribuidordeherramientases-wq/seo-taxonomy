name: Lint Ingeniero

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'includes/ingeniero/**'
      - 'includes/dependiente/seo-dependiente-admin.php'
      - 'includes/dependiente/seo-dependiente-bootstrap.php'
      - 'includes/editorial/**'
      - 'includes/solucionador/**'
      - 'includes/seo-includes-bootstrap.php'
      - 'includes/seo-process-supervisor.php'
  push:
    branches:
      - staging
    paths:
      - 'includes/ingeniero/**'
      - 'includes/dependiente/seo-dependiente-admin.php'
      - 'includes/dependiente/seo-dependiente-bootstrap.php'
      - 'includes/seo-process-supervisor.php'
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -v
          find includes/ingeniero -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find includes/editorial -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l includes/solucionador/solucionador-sources.php
          php -l includes/solucionador/solucionador-engine.php
          php -l includes/solucionador/solucionador-admin.php
          php -l includes/seo-includes-bootstrap.php
          php -l includes/dependiente/seo-dependiente-admin.php
          php -l includes/dependiente/seo-dependiente-bootstrap.php
          php -l includes/seo-process-supervisor.php
