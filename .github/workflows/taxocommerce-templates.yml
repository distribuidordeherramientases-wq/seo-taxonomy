name: Build and Deploy TaxoCommerce Templates to STAGING
on:
  push:
    branches: [staging]
    paths:
      - 'taxocommerce-templates/**'
      - '.github/workflows/taxocommerce-templates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: PHP syntax
        run: find taxocommerce-templates -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Check FRONT composer JavaScript and smoke tests
        run: |
          node --check taxocommerce-templates/assets/front-composer.js
          php taxocommerce-templates/tests/smoke.php
      - name: Check plugin independence
        run: |
          test -s taxocommerce-templates/taxocommerce-templates.php
          test -s taxocommerce-templates/templates/template-default.php
          if grep -R 'SEO_SYSTEM_PATH\|SEO_SYSTEM_FILE\|require_once.*seo-taxonomy' taxocommerce-templates --include='*.php'; then exit 1; fi
      - name: Package ZIP
        run: zip -qr taxocommerce-templates.zip taxocommerce-templates
      - uses: actions/upload-artifact@v4
        with:
          name: taxocommerce-templates-${{ github.sha }}
          path: taxocommerce-templates.zip
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - name: Upload only this plugin to STAGING
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./taxocommerce-templates/
          server-dir: ./wp-content/plugins/taxocommerce-templates/
          # Keep FTP synchronization state outside the installed standalone plugin.
          state-name: ../.taxocommerce-templates-ftp-state.json
          dry-run: false
          log-level: standard
          exclude: |
            tests/**
            **/tests/**
            **/.git*
            **/node_modules/**
            **/*.bak
