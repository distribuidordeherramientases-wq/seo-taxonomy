name: Check incremental PRO deployment (no deploy)

on:
  pull_request:
    paths:
      - '.github/workflows/despliege_de_main_a_pro.yml'
      - '.github/workflows/validate-production-deploy.yml'
      - '.github/scripts/build_pro_delta.py'
      - '.github/scripts/tests/test_build_pro_delta.py'
      - 'includes/seo-deploy-status.php'
  push:
    branches: [main, staging]
    paths:
      - '.github/workflows/despliege_de_main_a_pro.yml'
      - '.github/workflows/validate-production-deploy.yml'
      - '.github/scripts/build_pro_delta.py'
      - 'includes/seo-deploy-status.php'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify delta selection and PHP syntax
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts/tests -p 'test_build_pro_delta.py' -v
          python3 -m unittest discover -s .github/scripts/tests -p 'test_fetch_pro_installed_modules.py' -v
          php -l includes/seo-deploy-status.php

      - name: Check YAML and embedded shell/Python syntax (no FTP/PRO)
        run: |
          python3 -m pip install --user PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import yaml

          steps = yaml.safe_load(Path('.github/workflows/despliege_de_main_a_pro.yml').read_text())['jobs']['deploy']['steps']
          code = '\n'.join(s.get('run', '') for s in steps)
          php = Path('includes/seo-deploy-status.php').read_text()
          assert not any('FTP-Deploy-Action' in s.get('uses', '') for s in steps)
          assert 'build_pro_delta.py' in code
          assert 'status=success&per_page=1' in code
          assert 'ref: staging' in Path('.github/workflows/despliege_de_main_a_pro.yml').read_text()
          assert "return dirname( __DIR__ ) . '/.taxocommerce-deploy';" in php
          assert 'handoff=".taxocommerce-deploy/$GITHUB_RUN_ID"' in code
          assert "get_param( 'modules' )" in php
          assert 'manifest_sha256' in code and 'verified_files' in code
          # lftp can return 550 when a directory already exists.
          # The handoff must be idempotent but still verify cd strictly.
          handoff_step = next(s for s in steps if s.get('name') == 'Upload and apply changed files only')
          ftp_script = handoff_step['run']
          assert 'set cmd:fail-exit no' in ftp_script
          assert 'mkdir -p ".taxocommerce-deploy"' in ftp_script
          assert 'mkdir -p "$handoff"' in ftp_script
          assert 'set cmd:fail-exit yes\\n          cd "$handoff"' in ftp_script
          assert ftp_script.index('mkdir -p "$handoff"') < ftp_script.index('cd "$handoff"')
          assert 'Subir TaxoCommerce SEO antiguo' not in code
          assert not re.search(r'\bmirror\b.*--delete|\brm\s+-rf\s+\$\{?FTP', code)
          with tempfile.TemporaryDirectory() as temp:
              for n, step in enumerate(steps):
                  script = step.get('run')
                  if not script:
                      continue
                  path = Path(temp) / f'step-{n}.sh'
                  path.write_text(script)
                  subprocess.run(['bash', '-n', str(path)], check=True)
                  lines = script.splitlines()
                  for i, line in enumerate(lines):
                      if re.search(r"\bpython3\b.*<<'PY'\s*$", line):
                          end = next((j for j in range(i + 1, len(lines))
                                      if lines[j].strip() == 'PY'), None)
                          assert end is not None, 'Unterminated Python block'
                          compile('\n'.join(lines[i + 1:end]), step.get('name', 'inline'), 'exec')
          print('Incremental-only deployment and workflow syntax OK')
          PY
