name: TaxoCommerce Redirects - STAGING only
on:
  push:
    branches: [staging]
    paths:
      - 'taxocommerce-redirects/**'
      - '.github/workflows/deploy-taxocommerce-redirects-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    name: Verify and FTP deploy Redirects to STAGING
    steps:
      - name: Checkout approved STAGING branch
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Check PHP syntax and smoke tests
        run: |
          set -euo pipefail
          find taxocommerce-redirects -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          php taxocommerce-redirects/tests/smoke.php
          php taxocommerce-redirects/tests/lifecycle-smoke.php
          php taxocommerce-redirects/tests/auto-test-smoke.php
          php taxocommerce-redirects/tests/user-guide-smoke.php
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php standalone
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php core-before
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php core-after
          node --check taxocommerce-redirects/assets/core.js
          node --check taxocommerce-redirects/assets/block-editor.js

      - name: Prepare standalone installable ZIP
        run: |
          set -euo pipefail
          test -s taxocommerce-redirects/taxocommerce-redirects.php
          zip -q -r taxocommerce-redirects-0.1.7.zip taxocommerce-redirects/ -x '*/tests/*' '*/.*'
          if unzip -Z1 taxocommerce-redirects-0.1.7.zip | grep -E '(^|/)[.][^/]+'; then
            echo 'ERROR: standalone Redirects ZIP contains hidden files'
            exit 1
          fi
          unzip -t taxocommerce-redirects-0.1.7.zip
          unzip -Z1 taxocommerce-redirects-0.1.7.zip | grep -Fx 'taxocommerce-redirects/taxocommerce-redirects.php'

      - name: Publish independently installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: taxocommerce-redirects-0.1.7
          path: taxocommerce-redirects-0.1.7.zip
          retention-days: 30
          if-no-files-found: error

      - name: Deploy ONLY TaxoCommerce Redirects to STAGING
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./taxocommerce-redirects/
          server-dir: ./wp-content/plugins/taxocommerce-redirects/
          # FTP sync state must not be inside the installed WordPress plugin.
          state-name: ../.taxocommerce-redirects-ftp-state.json
          dry-run: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            **/*.bak
            **/*.md
            **/*.pot

      - name: Remove legacy hidden FTP state inside Redirects on STAGING
        # This action deletes only the old sync marker, never redirect rules or code.
        env:
          TC_REDIRECTS_FTP_HOST: ${{ secrets.STAGING_FTP_SERVER }}
          TC_REDIRECTS_FTP_USER: ${{ secrets.STAGING_FTP_USERNAME }}
          TC_REDIRECTS_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os

          ftp = ftplib.FTP_TLS(timeout=45)
          ftp.connect(os.environ["TC_REDIRECTS_FTP_HOST"], 21)
          ftp.login(os.environ["TC_REDIRECTS_FTP_USER"], os.environ["TC_REDIRECTS_FTP_PASSWORD"])
          ftp.prot_p()
          ftp.cwd("./wp-content/plugins/taxocommerce-redirects/")
          try:
              ftp.delete(".ftp-deploy-sync-state.json")
              print("Deleted previous hidden FTP state")
          except ftplib.error_perm as exc:
              if not str(exc).startswith("550"):
                  raise
          ftp.quit()
          PY
