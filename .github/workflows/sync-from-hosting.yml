name: Sincronizar plugin desde Webempresa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Abrir rama de sincronizacion
        uses: actions/checkout@v4
        with:
          ref: sync/hosting-current
          fetch-depth: 0

      - name: Instalar cliente FTPS
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Descargar seo-taxonomy desde Webempresa
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          rm -rf /tmp/seo-taxonomy
          mkdir -p /tmp/seo-taxonomy

          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          cd wp-content/plugins/seo-taxonomy
          mirror --verbose --parallel=4 . /tmp/seo-taxonomy
          bye
          EOF

      - name: Sincronizar con la rama
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/README.md' \
            --exclude='/CONTRIBUTING.md' \
            --exclude='/LICENSE' \
            /tmp/seo-taxonomy/ ./

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
            exit 0
          fi

          git commit -m "Sincronizar version actual desde Webempresa"
          git push origin HEAD:sync/hosting-current
