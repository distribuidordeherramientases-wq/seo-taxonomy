name: WordPress Plugin Check

on:
  pull_request:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      release_gate:
        description: 'Strict WordPress.org release gate (no Plugin Check warnings, ZIP under 10 MB)'
        required: true
        type: boolean
        default: true

concurrency:
  group: wp-plugin-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WordPress.org package tree
        run: |
          rm -rf build/taxocommerce-seo
          mkdir -p build/taxocommerce-seo
          rsync -a \
            --exclude='.git/' \
            --exclude='.*' \
            --exclude='.github/' \
            --exclude='build/' \
            --exclude='docs/' \
            --exclude='CONTRIBUTING.md' \
            --exclude='README.md' \
            --exclude='SUPPLIER-SYNC-V2.md' \
            --exclude='/taxocommerce-core/' \
            --exclude='/taxocommerce-images/' \
            --exclude='/taxocommerce-import-export/' \
            --exclude='/taxocommerce-system-check/' \
            --exclude='/taxocommerce-faqs/' \
            --exclude='/taxocommerce-auditor/' \
            --exclude='/taxocommerce-templates/' \
            --exclude='/packages/' \
            --exclude='node_modules/' \
            ./ build/taxocommerce-seo/
          # Sibling plugins have independent headers and translation domains.
          # They are deployed separately, never inside the taxocommerce-seo ZIP.
          for sibling in taxocommerce-core taxocommerce-images taxocommerce-import-export taxocommerce-system-check taxocommerce-faqs taxocommerce-auditor taxocommerce-templates packages; do
            test ! -e "build/taxocommerce-seo/$sibling"
          done

      - name: Validate WordPress.org package metadata and ZIP size
        env:
          RELEASE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate && 'true' || 'false' }}
        run: python3 .github/scripts/wordpress_quality_gate.py package build/taxocommerce-seo --strict "$RELEASE_GATE"

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/taxocommerce-seo'
          slug: taxocommerce-seo
          wp-version: latest
          ignore-warnings: false
          ignore-errors: false

      - name: Report warnings and enforce quality gate
        if: always()
        env:
          RELEASE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate && 'true' || 'false' }}
        run: python3 .github/scripts/wordpress_quality_gate.py report "$RUNNER_TEMP/plugin-check-results.txt" --strict "$RELEASE_GATE"

      - name: Upload complete Plugin Check findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-plugin-check-findings
          path: |
            ${{ runner.temp }}/plugin-check-findings.csv
            ${{ runner.temp }}/plugin-check-hotspots.csv
          retention-days: 30
          if-no-files-found: warn
