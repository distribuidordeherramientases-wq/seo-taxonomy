name: WordPress Plugin Check

on:
  pull_request:
  push:
    branches:
      - staging
      - main
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './'
          slug: seo-taxonomy
          wp-version: latest
