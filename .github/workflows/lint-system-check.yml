name: Lint System Check

on:
  pull_request:
    paths:
      - 'includes/system-check/**'
      - 'docs/manual/HERRAMIENTAS.md'
  push:
    branches:
      - staging
    paths:
      - 'includes/system-check/**'
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -v
          find includes/system-check -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
