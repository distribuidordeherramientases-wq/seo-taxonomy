name: Temporal lint social campaign images

on:
  push:
    branches:
      - fix/social-campaign-product-images

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l includes/social-network/campaign-images.php
          php -l includes/social-network/campaigns.php
          php -l includes/social-network/facebook.php
