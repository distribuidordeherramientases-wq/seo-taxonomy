name: TaxoCommerce - consolidate repository labels to five

# A one-time repository administration task for Issue #2054.
# A PR only checks the migration plan. The first merge into staging applies it.
on:
  pull_request:
    branches: [staging]
    paths:
      - '.github/workflows/taxocommerce-five-labels-once.yml'
      - '.github/scripts/consolidate_taxocommerce_labels_once.py'
  push:
    branches: [staging]
    paths:
      - '.github/workflows/taxocommerce-five-labels-once.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: taxocommerce-five-labels-repository-cleanup
  cancel-in-progress: false

jobs:
  consolidate:
    name: Validate and consolidate existing GitHub labels
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile .github/scripts/consolidate_taxocommerce_labels_once.py
      - name: Preview label migration without mutations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/consolidate_taxocommerce_labels_once.py
      - name: Apply only after merge to staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/consolidate_taxocommerce_labels_once.py --apply
      - name: Save issue/PR label mapping for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxocommerce-five-labels-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/taxocommerce-labels-migration.json
          retention-days: 90
          if-no-files-found: warn
