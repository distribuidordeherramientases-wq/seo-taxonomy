name: TaxoCommerce Redirects CI
on:
  pull_request:
    branches: [staging]
    paths:
      - 'taxocommerce-redirects/**'
      - '.github/workflows/ci-taxocommerce-redirects.yml'
  workflow_dispatch:

jobs:
  lint-and-smoke:
    name: PHP ${{ matrix.php }} lint and smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Check PHP syntax
        run: find taxocommerce-redirects -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Test native and Core integration contracts
        run: |
          php taxocommerce-redirects/tests/smoke.php
          php taxocommerce-redirects/tests/lifecycle-smoke.php
          php taxocommerce-redirects/tests/auto-test-smoke.php
          php taxocommerce-redirects/tests/user-guide-smoke.php
      - name: Check editor integration JavaScript
        run: |
          node --check taxocommerce-redirects/assets/core.js
          node --check taxocommerce-redirects/assets/block-editor.js
