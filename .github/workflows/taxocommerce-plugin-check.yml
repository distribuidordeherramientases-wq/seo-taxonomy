name: TaxoCommerce Plugin Check - independent preflight

on:
  workflow_call:
    inputs:
      plugin:
        description: 'Specific plugin slug or all TaxoCommerce plugins'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin slug to check (for example taxocommerce-templates)'
        required: true
        type: string
        default: taxocommerce-templates
  pull_request:
    branches: [staging]
    paths:
      - 'taxocommerce-*/**'
      - '.github/workflows/taxocommerce-plugin-check.yml'

permissions:
  contents: read

jobs:
  select:
    name: Select plugins for official Plugin Check
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.select.outputs.plugins }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        name: Select explicitly requested plugin or changed plugin directories
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PLUGIN: ${{ inputs.plugin }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          valid = re.compile(r"taxocommerce-[a-z0-9-]+\Z")
          if os.environ.get("REQUESTED_PLUGIN") == "all":
              selected = sorted(
                  folder.name for folder in Path(".").glob("taxocommerce-*")
                  if folder.name != "taxocommerce-connections"
                  and folder.is_dir() and (folder / (folder.name + ".php")).is_file()
              )
              if not selected:
                  raise SystemExit("No TaxoCommerce plugins found for strict gate")
          elif os.environ.get("REQUESTED_PLUGIN") == "changed":
              diff = subprocess.check_output(
                  ["git", "diff", "--name-only", "-z", "HEAD^", "HEAD"]
              ).decode("utf-8").split("\0")
              selected = sorted({
                  name.split("/", 1)[0]
                  for name in diff
                  if name.startswith("taxocommerce-") and "/" in name
                  and (Path(name.split("/", 1)[0]) / (name.split("/", 1)[0] + ".php")).is_file()
              })
          elif os.environ["EVENT_NAME"] == "workflow_dispatch":
              selected = [os.environ["REQUESTED_PLUGIN"]]
          else:
              diff = subprocess.check_output(
                  ["git", "diff", "--name-only", "-z", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]]
              ).decode("utf-8").split("\0")
              selected = sorted({
                  name.split("/", 1)[0]
                  for name in diff
                  if name.startswith("taxocommerce-") and "/" in name
              })
          for slug in selected:
              if not valid.fullmatch(slug):
                  raise SystemExit(f"Refusing invalid plugin name: {slug!r}")
              folder = Path(slug)
              if not folder.is_dir() or not (folder / (slug + ".php")).is_file():
                  raise SystemExit(f"Plugin entrypoint missing: {slug}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("plugins=" + json.dumps(selected, separators=(",", ":")) + "\n")
              stream.write("count=" + str(len(selected)) + "\n")
          print(f"Official Plugin Check will inspect {len(selected)} plugin(s): {selected}")
          PY

  plugin-check:
    name: Official Plugin Check / ${{ matrix.plugin }}
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        plugin: ${{ fromJSON(needs.select.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Package only the installable plugin files (no tests or FTP state)
        id: package
        env:
          PLUGIN: ${{ matrix.plugin }}
        shell: bash
        run: |
          set -euo pipefail
          # WordPress.org confirmed the public slug taxocommerce-core.
          # Package the installed and public plugin from the exact same files.
          TARGET_SLUG="$PLUGIN"
          echo "target_slug=$TARGET_SLUG" >> "$GITHUB_OUTPUT"
          mkdir -p "build/$TARGET_SLUG"
          rsync -a --exclude='tests/' --exclude='.*' --exclude='node_modules/' \
            --exclude='uploads/' --exclude='*.bak' --exclude='*.log' \
            --exclude='*.pyc' --exclude='*.pot' --include='/CHANGELOG.md' --exclude='*.md' \
            "$PLUGIN/" "build/$TARGET_SLUG/"
          if [ "$PLUGIN" = "taxocommerce-core" ]; then
            # Never ship the obsolete long-slug translations in the short-slug ZIP.
            find "build/$TARGET_SLUG/languages" -maxdepth 1 -type f \
              -name 'taxocommerce-core-catalog-content-management-for-woocommerce-*' -delete
            php "$PLUGIN/tests/slug-compatibility-smoke.php"
            python3 -m unittest discover -s .github/tests -p test_package_core_wordpress_org.py -v
            python3 .github/scripts/package_core_wordpress_org.py "build/$TARGET_SLUG"
          fi
          test -f "build/$TARGET_SLUG/$TARGET_SLUG.php"
          test -f "build/$TARGET_SLUG/readme.txt"
          # All twenty independent plugins use their own bundled changelog.
          test -s "build/$TARGET_SLUG/CHANGELOG.md"
          if find "build/$TARGET_SLUG" -name '.*' -o -name '.ftp-deploy-sync-state.json' | grep -q .; then
            echo "::error::Hidden or FTP synchronization files found"
            exit 1
          fi
          find "build/$TARGET_SLUG" -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l
          # Optional, read-only plugin-specific boot regression (not packed in ZIP).
          if [ -f "$PLUGIN/tests/standalone-bootstrap-smoke.php" ]; then
            php "$PLUGIN/tests/standalone-bootstrap-smoke.php"
          fi
          # Consent configuration JSON is part of Insights' public runtime:
          # test full export/restore and five published-country gates on every PR.
          if [ "$PLUGIN" = 'taxocommerce-google-bing' ]; then
            php "$PLUGIN/tests/consent-json-import-smoke.php"
            php "$PLUGIN/tests/consent-wpoptions-seed-smoke.php"
            php "$PLUGIN/tests/consent-smoke.php"
          fi
          # Images read-only cleanup: no WP-Cron, bounded reference caching,
          # signed server runner and authenticated browser recovery.
          if [ "$PLUGIN" = 'taxocommerce-images' ]; then
            php -l "$PLUGIN/includes/class-taxocommerce-images-background.php"
            php -l "$PLUGIN/includes/class-taxocommerce-images-maintenance.php"
            php "$PLUGIN/tests/cleanup-window-smoke.php"
            php "$PLUGIN/tests/cleanup-worker-smoke.php"
            node --check "$PLUGIN/assets/background.js"
            node --check "$PLUGIN/assets/maintenance.js"
            node "$PLUGIN/tests/cleanup-browser-smoke.js"
          fi
          python3 .github/scripts/taxocommerce_family_readme_check.py "$PLUGIN" "build/$TARGET_SLUG"
          ( cd build && zip -qr "../$PLUGIN-plugin-check.zip" "$TARGET_SLUG" )
          unzip -t "$PLUGIN-plugin-check.zip"
          sha256sum "$PLUGIN-plugin-check.zip" > "$PLUGIN-plugin-check.sha256"
          printf 'Plugin: %s\nCommit: %s\nWorkflow: %s\n' \
            "$PLUGIN" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$PLUGIN-plugin-check-source.txt"
          echo "## Plugin Check: $PLUGIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Official WordPress Plugin Check - errors and warnings must pass
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/${{ steps.package.outputs.target_slug }}
          slug: ${{ steps.package.outputs.target_slug }}
          wp-version: latest
          ignore-warnings: false
          ignore-errors: false
          strict: true
      - name: Preserve checked ZIP, checksum and exact source revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-plugin-check-${{ matrix.plugin }}-${{ github.run_id }}
          path: |
            ${{ matrix.plugin }}-plugin-check.zip
            ${{ matrix.plugin }}-plugin-check.sha256
            ${{ matrix.plugin }}-plugin-check-source.txt
          retention-days: 30
          if-no-files-found: warn

  gate:
    name: Plugin Check / gate
    if: always()
    needs: [select, plugin-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected plugin to pass
        env:
          SELECT: ${{ needs.select.result }}
          COUNT: ${{ needs.select.outputs.count }}
          CHECK: ${{ needs.plugin-check.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SELECT" = success
          if [ "$COUNT" = 0 ]; then
            echo "No changed plugin code in this PR."
          else
            test "$CHECK" = success
            echo "All selected plugins passed the official WordPress Plugin Check."
          fi
