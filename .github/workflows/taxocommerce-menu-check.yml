name: TaxoCommerce Core Menu QA
on:
  pull_request:
    paths:
      - 'taxocommerce-core/includes/class-taxocommerce-core-menu*.php'
      - 'taxocommerce-core/assets/menu-editor.*'
      - '.github/tests/taxocommerce-core/menu-editor-smoke.php'
      - '.github/tests/taxocommerce-core/country-scope-smoke.php'
      - '.github/tests/taxocommerce-core/hierarchy-country-schema-smoke.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core-country.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core-auto-test.php'
      - '.github/tests/taxocommerce-core/auto-test-smoke.php'
      - '.github/tests/taxocommerce-core/auto-test-navigation-smoke.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core-dashboard.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core-user-guide.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core-hierarchy*.php'
      - '.github/workflows/taxocommerce-menu-check.yml'
  push:
    branches: [staging]
    paths:
      - 'taxocommerce-core/includes/class-taxocommerce-core-menu*.php'
      - 'taxocommerce-core/assets/menu-editor.*'
      - '.github/tests/taxocommerce-core/menu-editor-smoke.php'
      - '.github/tests/taxocommerce-core/country-scope-smoke.php'
      - '.github/tests/taxocommerce-core/hierarchy-country-schema-smoke.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core-country.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core-auto-test.php'
      - '.github/tests/taxocommerce-core/auto-test-smoke.php'
      - '.github/tests/taxocommerce-core/auto-test-navigation-smoke.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core-dashboard.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core-user-guide.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core-hierarchy*.php'
      - '.github/workflows/taxocommerce-menu-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menu-regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find taxocommerce-core -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Menu behavior and callback regression
        run: php .github/tests/taxocommerce-core/menu-editor-smoke.php
      - name: Auto Test functional checks (pass, failure, skipped, permissions)
        run: php .github/tests/taxocommerce-core/auto-test-smoke.php
      - name: Auto Test belongs in Core internal tabs, never WordPress sidebar
        run: php .github/tests/taxocommerce-core/auto-test-navigation-smoke.php
      - name: Country scoping and legacy compatibility
        run: php .github/tests/taxocommerce-core/country-scope-smoke.php
      - name: Canonical hierarchy country-schema upgrade
        run: php .github/tests/taxocommerce-core/hierarchy-country-schema-smoke.php
      - name: JavaScript syntax
        run: node --check taxocommerce-core/assets/menu-editor.js
