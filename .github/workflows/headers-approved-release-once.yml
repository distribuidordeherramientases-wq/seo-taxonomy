name: One-time approved family headers release

# This file is intentionally introduced in the release PR once; it does not
# change the existing staged Plugin Check or production delivery gates.
on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/headers-approved-release-once.yml

permissions:
  contents: read

jobs:
  dispatch-approved-release:
    if: github.repository == 'distribuidordeherramientases-wq/seo-taxonomy'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout exactly the approved staging revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify 20 plugin headers and bundled changelogs
        shell: bash
        run: |
          set -euo pipefail
          php .github/tests/family-admin-header-smoke.php
          for main in taxocommerce-*/taxocommerce-*.php; do
            slug="${main%%/*}"
            test -f "$slug/CHANGELOG.md"
            test -s "$slug/CHANGELOG.md"
          done

      - name: Require that staging has not changed during validation
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/staging | cut -f1)"
          test -n "$latest"
          test "$latest" = "$GITHUB_SHA"

      - name: Cancel superseded approved revision before release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous=42895397391
          status="$(gh run view "$previous" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
          if [ "$status" != "completed" ]; then
            gh run cancel "$previous" --repo "$GITHUB_REPOSITORY"
            for attempt in $(seq 1 48); do
              status="$(gh run view "$previous" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
              if [ "$status" = "completed" ]; then
                break
              fi
              sleep 5
            done
            if [ "$status" != "completed" ]; then
              echo "::error::The old revision is still running. New release blocked."
              exit 1
            fi
          fi

      - name: Dispatch existing mandatory STAGING -> Plugin Check -> PRO workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run staging_check_subida_a_pro.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref staging \
            -f full_sync=false \
            -f deploy_pro=true
