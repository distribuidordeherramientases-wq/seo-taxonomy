name: STAGING -> Plugin Check -> PRO (gated)

on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Full STAGING/Focazul reconciliation; default deploy only changed files'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Deliberately manual: merges already trigger the independent STAGING workflow.
# Automatic triggering here would run two competing FTPS deployments.
concurrency:
  group: taxocommerce-staging-check-pro
  cancel-in-progress: false

jobs:
  preflight:
    name: Require the staging branch
    runs-on: ubuntu-latest
    steps:
      - name: Never deploy a non-staging ref
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_REF" != 'refs/heads/staging' ]; then
            echo "::error::Select branch staging when running this pipeline. Ref: $SOURCE_REF"
            exit 1
          fi

  staging:
    name: '1 / Deliver STAGING and Focazul'
    needs: preflight
    uses: ./.github/workflows/deploy-staging.yml
    with:
      full_sync: ${{ inputs.full_sync }}
    secrets: inherit
    permissions:
      contents: read
      actions: read

  plugin-check:
    name: '2 / Official WordPress Plugin Check (strict)'
    needs: staging
    if: needs.staging.result == 'success'
    uses: ./.github/workflows/taxocommerce-plugin-check.yml
    with:
      plugin: all
    permissions:
      contents: read

  production:
    name: '3 / Deploy to PRO (approved revision only)'
    needs: [staging, plugin-check]
    if: needs.staging.result == 'success' && needs.plugin-check.result == 'success'
    uses: ./.github/workflows/despliege_de_main_a_pro.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read

  report-failure:
    name: 'Stop and open an issue on failure'
    needs: [preflight, staging, plugin-check, production]
    if: ${{ always() && (needs.preflight.result == 'failure' || needs.staging.result == 'failure' || needs.plugin-check.result == 'failure' || needs.production.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report failed phase and open an actionable GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          STAGING_RESULT: ${{ needs.staging.result }}
          PLUGIN_CHECK_RESULT: ${{ needs.plugin-check.result }}
          PRO_RESULT: ${{ needs.production.result }}
          SOURCE_SHA: ${{ github.sha }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELECTED_PLUGIN: all
          FULL_SYNC: ${{ inputs.full_sync }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Pipeline halted: manual repair is required'
            echo
            echo "Run: $PIPELINE_URL"
            echo "Source SHA: \`$SOURCE_SHA\`"
            echo "Plugin scope: \`$SELECTED_PLUGIN\`"
            echo "Full STAGING sync: \`$FULL_SYNC\`"
            echo
            echo "| Phase | Result |"
            echo "|---|---|"
            echo "| 0. Source branch | $PREFLIGHT_RESULT |"
            echo "| 1. STAGING + Focazul | $STAGING_RESULT |"
            echo "| 2. Official Plugin Check | $PLUGIN_CHECK_RESULT |"
            echo "| 3. PRO | $PRO_RESULT |"
            echo
            echo '### Next steps'
            echo '1. Inspect the failed job logs and identify the actual root cause.'
            echo '2. Correct the source or deployment configuration in a dedicated branch.'
            echo '3. Open a PR to staging, validate it, then merge.'
            echo '4. Run staging_check_subida_a_pro.yml again from staging.'
            echo
            echo '**Never force a production deployment past a failed gate.**'
          } > pipeline-failure.md
          gh issue create \
            --title "Pipeline STAGING -> Check -> PRO failed (run $GITHUB_RUN_ID)" \
            --body-file pipeline-failure.md
