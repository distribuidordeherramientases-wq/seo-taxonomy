name: STAGING -> Plugin Check -> PRO (gated)

on:
  push:
    branches:
      - staging
    paths:
      - 'taxocommerce-*/**'
      - '.github/scripts/deploy_staging_delta.py'
      - '.github/scripts/fetch_pro_installed_modules.py'
      - '.github/scripts/audit_core_dual_sites.py'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/taxocommerce-plugin-check.yml'
      - '.github/workflows/despliege_de_main_a_pro.yml'
      - '.github/workflows/staging_check_subida_a_pro.yml'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Full STAGING/Focazul reconciliation; default deploy only changed files'
        type: boolean
        required: false
        default: false
      deploy_pro:
        description: 'Explicit approval: update PRO only on a manual workflow run'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Pushes to staging may deploy only to STAGING/Focazul.
# PRO requires a manual workflow_dispatch with deploy_pro=true.
# The shared FTPS delivery is serialized by the called deploy-staging.yml
# workflow, NOT by this entire pipeline. Holding the global concurrency
# lock during 20 Plugin Check jobs starved later STAGING/Focazul releases,
# whose pending runs were replaced on every new merge.
# Keep the strict Plugin Check and manual PRO gates per release.
jobs:
  preflight:
    name: Require current staging revision
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reject non-staging refs and skip obsolete queued releases
        id: version
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_REF" != 'refs/heads/staging' ]; then
            echo "::error::This release must run from staging. Ref: $SOURCE_REF"
            exit 1
          fi
          latest="$(git ls-remote origin refs/heads/staging | cut -f1)"
          test -n "$latest"
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "Superseded release: $SOURCE_SHA; latest staging: $latest"
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

  staging:
    name: '1 / Deliver STAGING and Focazul'
    needs: preflight
    if: needs.preflight.outputs.current == 'true'
    uses: ./.github/workflows/deploy-staging.yml
    with:
      full_sync: ${{ inputs.full_sync || false }}
    secrets: inherit
    permissions:
      contents: read
      actions: read

  plugin-check:
    name: '2 / Official WordPress Plugin Check (strict)'
    needs: staging
    if: needs.staging.result == 'success'
    uses: ./.github/workflows/taxocommerce-plugin-check.yml
    with:
      plugin: all
    permissions:
      contents: read

  production:
    name: '3 / Deploy to PRO (approved revision only)'
    needs: [staging, plugin-check]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pro == true && needs.staging.result == 'success' && needs.plugin-check.result == 'success' }}
    uses: ./.github/workflows/despliege_de_main_a_pro.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read

  report-failure:
    name: 'Stop and open an issue on failure'
    needs: [preflight, staging, plugin-check, production]
    if: ${{ always() && (needs.preflight.result == 'failure' || needs.staging.result == 'failure' || needs.plugin-check.result == 'failure' || needs.production.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report failed phase and open an actionable GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          STAGING_RESULT: ${{ needs.staging.result }}
          PLUGIN_CHECK_RESULT: ${{ needs.plugin-check.result }}
          PRO_RESULT: ${{ needs.production.result }}
          SOURCE_SHA: ${{ github.sha }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELECTED_PLUGIN: all
          FULL_SYNC: ${{ inputs.full_sync || false }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Pipeline halted: repair required'
            echo
            echo "Run: $PIPELINE_URL"
            echo "Source SHA: \`$SOURCE_SHA\`"
            echo "Plugin scope: \`$SELECTED_PLUGIN\`"
            echo "Full STAGING sync: \`$FULL_SYNC\`"
            echo
            echo "| Phase | Result |"
            echo "|---|---|"
            echo "| 0. Source branch | $PREFLIGHT_RESULT |"
            echo "| 1. STAGING + Focazul | $STAGING_RESULT |"
            echo "| 2. Official Plugin Check | $PLUGIN_CHECK_RESULT |"
            echo "| 3. PRO | $PRO_RESULT |"
            echo
            echo '### Next steps'
            echo '1. Inspect the failed job logs and identify the actual root cause.'
            echo '2. Correct the source or deployment configuration in a dedicated branch.'
            echo '3. Open a PR to staging, validate it, then merge.'
            echo '4. Merge the fix into staging: the 3-phase pipeline reruns automatically on push.'
            echo
            echo '**Never force a production deployment past a failed gate.**'
          } > pipeline-failure.md
          issue_url="$(gh issue create \
            --title "Pipeline STAGING -> Check -> PRO failed (run $GITHUB_RUN_ID)" \
            --body-file pipeline-failure.md)"
          echo "Opened failure issue: $issue_url"
          # Copilot can investigate and propose a repair PR if its user-to-server
          # token is explicitly configured. A GITHUB_TOKEN alone is insufficient.
          # The agent cannot bypass PR checks or directly publish to production.
          if [ -n "$COPILOT_AGENT_TOKEN" ]; then
            issue_number="${issue_url##*/}"
            printf '{"assignees":["copilot-swe-agent[bot]"],"agent_assignment":{"target_repo":"%s","base_branch":"staging","custom_instructions":"Investigate failed pipeline run, propose the minimal correction, run tests, and open a PR targeting staging. Do not deploy to PRO, skip checks or alter credentials."}}' "$GH_REPO" > /tmp/agent-assignment.json
            GH_TOKEN="$COPILOT_AGENT_TOKEN" gh api \
              --method POST \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GH_REPO/issues/$issue_number/assignees" \
              --input /tmp/agent-assignment.json \
              || echo "::warning::Copilot assignment unavailable. Issue remains available for repair."
          fi
