name: Reconcile three TaxoCommerce plugins on both test sites

on:
  pull_request:
    paths:
      - '.github/workflows/reconcile-three-plugins-20261104.yml'
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/reconcile-three-plugins-20261104.yml'

permissions:
  contents: read

concurrency:
  group: taxocommerce-reconcile-three-20261104
  cancel-in-progress: false

jobs:
  validate:
    name: Validate safe dual-site plugin sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment guardrails
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/deploy_staging_delta.py
          python3 -m unittest discover -s .github/tests -p test_deploy_staging_delta.py -v
          for slug in taxocommerce-distribution taxocommerce-templates taxocommerce-import-export; do
            test -f "$slug/$slug.php"
            php -l "$slug/$slug.php"
          done

  reconcile:
    name: Sync Distribution Templates and Import-Export to both WordPress installs
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update and verify only three already installed plugin directories
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # --full uses the tracked, installable plugin manifest and compares
          # each remote file by SHA-256. No deletions or new plugin installs.
          BASE="$(git rev-parse HEAD^)"
          for slug in taxocommerce-distribution taxocommerce-templates taxocommerce-import-export; do
            echo "Reconcile $slug on STAGING"
            python3 .github/scripts/deploy_staging_delta.py deploy --base "$BASE" --target staging --slug "$slug" --full true
            echo "Reconcile $slug on Focazul"
            python3 .github/scripts/deploy_staging_delta.py deploy --base "$BASE" --target focazul --slug "$slug" --full true
            echo "VERIFIED $slug: matching tracked plugin files on both sites"
          done
