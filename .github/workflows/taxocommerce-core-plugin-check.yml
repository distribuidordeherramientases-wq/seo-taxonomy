name: TaxoCommerce Core Plugin Check

on:
  pull_request:
    branches: [staging]
    paths:
      - 'taxocommerce-core/**'
      - '.github/workflows/taxocommerce-core-plugin-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-plugin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Package Core without CI tests or hidden FTP state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/taxocommerce-core
          rsync -a \
            --exclude='tests/' \
            --exclude='.*' \
            --exclude='*.json.bak' \
            --exclude='README.md' \
            --exclude='*.bak' \
            --exclude='*.log' \
            taxocommerce-core/ build/taxocommerce-core/
          test -f build/taxocommerce-core/taxocommerce-core.php
          test -f build/taxocommerce-core/readme.txt
          find build/taxocommerce-core -name '*.php' -print0 | xargs -0 -r -n1 php -l
          python3 .github/scripts/taxocommerce_family_readme_check.py taxocommerce-core build/taxocommerce-core
          ( cd build && zip -qr ../taxocommerce-core.zip taxocommerce-core )
          unzip -t taxocommerce-core.zip
          if unzip -Z1 taxocommerce-core.zip | grep -E '(^|/)(tests/|[.][^/]+)'; then
            echo "::error::Core package includes tests or hidden files"
            exit 1
          fi
      - name: WordPress Plugin Check including warnings
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/taxocommerce-core
          slug: taxocommerce-core
          wp-version: latest
          ignore-warnings: false
          ignore-errors: false
          strict: true
      - name: Save distributable ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-plugin-check-zip
          path: taxocommerce-core.zip
          retention-days: 14
          if-no-files-found: warn
