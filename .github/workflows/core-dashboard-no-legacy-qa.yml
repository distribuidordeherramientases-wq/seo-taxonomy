name: Core dashboard independent status QA

on:
  pull_request:
    paths:
      - 'taxocommerce-core/includes/class-taxocommerce-core-dashboard.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core.php'
      - 'taxocommerce-core/taxocommerce-core.php'
      - '.github/tests/core-dashboard-no-legacy-smoke.php'
      - '.github/workflows/core-dashboard-no-legacy-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: |
          php -l taxocommerce-core/includes/class-taxocommerce-core-dashboard.php
          php -l taxocommerce-core/includes/class-taxocommerce-core.php
          php -l taxocommerce-core/taxocommerce-core.php
          php -l .github/tests/core-dashboard-no-legacy-smoke.php
      - name: Run dashboard regression
        run: php .github/tests/core-dashboard-no-legacy-smoke.php
