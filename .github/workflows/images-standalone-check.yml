name: TaxoCommerce Images standalone validation

on:
  pull_request:
    paths:
      - 'taxocommerce-images/**'
      - '.github/workflows/images-standalone-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check (Images only)
        run: find taxocommerce-images -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Ensure standalone package has no monolith includes
        run: |
          ! grep -R -nE 'require(_once)? .*seo-taxonomy|include(_once)? .*seo-taxonomy|SEO_SYSTEM_PATH|SEO_SYSTEM_URL|seo_images_[a-zA-Z0-9_]+\\(' taxocommerce-images --include='*.php'
          test -f taxocommerce-images/taxocommerce-images.php
      - name: Category-related Media assignment smoke test
        run: php .github/tests/taxocommerce-images-assignment-smoke.php
      - name: Build distributable Images package
        run: |
          rm -rf build/taxocommerce-images
          mkdir -p build/taxocommerce-images
          rsync -a \
            --exclude='tests/' \
            --exclude='*.md' \
            --exclude='node_modules/' \
            --exclude='*.bak' \
            taxocommerce-images/ build/taxocommerce-images/
          test -f build/taxocommerce-images/taxocommerce-images.php
          test ! -e build/taxocommerce-images/tests

      - name: WordPress Plugin Check for standalone Images package
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/taxocommerce-images'
          slug: taxocommerce-images
          wp-version: latest
          # Keep real Plugin Check errors blocking. Warnings stay visible but
          # do not block an internal TaxoCommerce release.
          ignore-warnings: true
          ignore-errors: false
