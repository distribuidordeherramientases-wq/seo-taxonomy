name: TaxoCommerce Images standalone validation

on:
  pull_request:
    paths:
      - 'taxocommerce-images/**'
      - 'includes/seo-deploy-status.php'
      - '.github/tests/images-pro-deploy-cleanup-smoke.php'
      - '.github/workflows/images-standalone-check.yml'
  # Catch warning regressions in the exact commit deployed to STAGING.
  push:
    branches: [staging]
    paths:
      - 'taxocommerce-images/**'
      - 'includes/seo-deploy-status.php'
      - '.github/tests/images-pro-deploy-cleanup-smoke.php'
      - '.github/workflows/images-standalone-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check (Images only)
        run: find taxocommerce-images -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate PRO Images cleanup (offline, no deletion of installed plugins)
        run: |
          php -l includes/seo-deploy-status.php
          php .github/tests/images-pro-deploy-cleanup-smoke.php
      - name: Validate read-only user and developer manual
        run: php taxocommerce-images/tests/manual-smoke.php
      - name: Ensure standalone package has no monolith includes
        run: |
          ! grep -R -nE 'require(_once)? .*seo-taxonomy|include(_once)? .*seo-taxonomy|SEO_SYSTEM_PATH|SEO_SYSTEM_URL|seo_images_[a-zA-Z0-9_]+\\(' taxocommerce-images --include='*.php'
          test -f taxocommerce-images/taxocommerce-images.php
      - name: Category-related Media assignment smoke test
        run: php .github/tests/taxocommerce-images-assignment-smoke.php
      - name: Build distributable Images package
        run: |
          rm -rf build/taxocommerce-images
          mkdir -p build/taxocommerce-images
          rsync -a \
            --exclude='tests/' \
            --exclude='*.md' \
            --exclude='node_modules/' \
            --exclude='*.bak' \
            taxocommerce-images/ build/taxocommerce-images/
          test -f build/taxocommerce-images/taxocommerce-images.php
          test ! -e build/taxocommerce-images/tests

      - name: WordPress Plugin Check for standalone Images package
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/taxocommerce-images'
          slug: taxocommerce-images
          wp-version: latest
          # WordPress.org submission gate: ALL categories, zero errors and zero warnings.
          # Unlike the default action behavior, strict=true fails on any warning.
          ignore-warnings: false
          ignore-errors: false
          strict: true
