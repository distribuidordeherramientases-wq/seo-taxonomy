name: Focazul Core restore missing block-navigation file (#2099)

on:
  pull_request:
    paths:
      - '.github/workflows/hotfix-focazul-core-block-2099.yml'
  push:
    branches: [staging]
    paths:
      - '.github/workflows/hotfix-focazul-core-block-2099.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Verify only required, valid Core source is selected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source PHP and narrow FTPS target
        run: |
          php -l taxocommerce-core/includes/class-taxocommerce-core-block-navigation.php
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts")
          from deploy_staging_delta import remote_plugin_dir
          source = Path("taxocommerce-core/includes/class-taxocommerce-core-block-navigation.php")
          assert source.is_file() and source.stat().st_size > 0
          expected = "./asociacionfocazul/wp-content/plugins/taxocommerce-core/"
          assert remote_plugin_dir("focazul", "taxocommerce-core") == expected
          print("Preflight: source present; target restricted to existing Focazul Core.")
          PY

  restore:
    name: Restore just one absent file on Focazul using existing FTPS
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atomic FTPS restore; reject differing existing content
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import hashlib
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, ".github/scripts")
          from deploy_staging_delta import (
              existing_file_hash, remote_plugin_dir, upload_plugin
          )

          slug = "taxocommerce-core"
          relative = "includes/class-taxocommerce-core-block-navigation.php"
          source = Path(slug) / relative
          expected_hash = hashlib.sha256(source.read_bytes()).hexdigest()
          credentials = (
              os.environ["STAGING_FTP_SERVER"],
              os.environ["STAGING_FTP_USERNAME"],
              os.environ["STAGING_FTP_PASSWORD"],
          )
          ftp = ftplib.FTP_TLS(timeout=45)
          try:
              ftp.connect(credentials[0], 21)
              ftp.login(credentials[1], credentials[2])
              ftp.prot_p()
              login_root = ftp.pwd()
              target = remote_plugin_dir("focazul", slug)
              ftp.cwd(target)
              actual_hash = existing_file_hash(ftp, relative)
              if actual_hash is not None and actual_hash != expected_hash:
                  raise RuntimeError("Existing Focazul file differs; refusing overwrite")
              ftp.cwd(login_root)
              upload_plugin(ftp, "focazul", slug, [relative], required=True)
              ftp.cwd(login_root)
              ftp.cwd(target)
              confirmed = existing_file_hash(ftp, relative)
              if confirmed != expected_hash:
                  raise RuntimeError("Remote content does not match source SHA-256")
              print("RESTORED AND VERIFIED: " + relative)
              print("Focazul Core file SHA-256: " + expected_hash)
              print("No other WordPress/plugin files modified.")
          finally:
              try:
                  ftp.quit()
              except ftplib.all_errors:
                  ftp.close()
          PY
