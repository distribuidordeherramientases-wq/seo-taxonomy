name: TaxoCommerce Import-Export Autocheck QA

on:
  pull_request:
    branches: [staging]
    paths:
      - 'taxocommerce-import-export/**'
      - '.github/workflows/import-export-autocheck-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autocheck-and-plugin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP lint all installable code
        run: |
          find taxocommerce-import-export -name '*.php' -not -path '*/tests/*' -print0 | xargs -0 -r -n1 php -l
      - name: Test two-button Autocheck, report isolation and 35 checks
        run: php taxocommerce-import-export/tests/auto-test-smoke.php
      - name: Make clean WordPress.org ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/taxocommerce-import-export
          rsync -a --exclude='tests/' --exclude='.*' --exclude='*.bak' --exclude='*.log' \
            taxocommerce-import-export/ build/taxocommerce-import-export/
          python3 .github/scripts/taxocommerce_family_readme_check.py \
            taxocommerce-import-export build/taxocommerce-import-export
          ( cd build && zip -qr ../taxocommerce-import-export.zip taxocommerce-import-export )
          unzip -t taxocommerce-import-export.zip
          if unzip -Z1 taxocommerce-import-export.zip | grep -E '(^|/)(tests/|[.][^/]+)'; then
            echo "::error::Unexpected test or hidden file in plugin ZIP"
            exit 1
          fi
      - name: WordPress Plugin Check (strict, warnings blocking)
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/taxocommerce-import-export
          slug: taxocommerce-import-export
          wp-version: latest
          ignore-warnings: false
          ignore-errors: false
          strict: true
      - name: Save installable ZIP for manual WordPress QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-export-0-4-15-qa-zip
          path: taxocommerce-import-export.zip
          retention-days: 14
          if-no-files-found: warn
