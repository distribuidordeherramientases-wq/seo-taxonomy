name: Build and Deploy TaxoCommerce Insights to STAGING
on:
  push:
    branches: [staging]
    paths:
      - 'taxocommerce-google-bing/**'
      - 'taxocommerce-connections/taxocommerce-connections.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core.php'
      - '.github/workflows/taxocommerce-google-bing.yml'
  pull_request:
    branches: [staging]
    paths:
      - 'taxocommerce-google-bing/**'
      - 'taxocommerce-connections/taxocommerce-connections.php'
      - 'taxocommerce-core/includes/class-taxocommerce-core.php'
      - '.github/workflows/taxocommerce-google-bing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: PHP syntax
        run: find taxocommerce-google-bing -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Insights-owned GEO AJAX regression
        run: php taxocommerce-google-bing/tests/geo-bridge-smoke.php
      - name: Merged Analysis functional regression
        run: php taxocommerce-google-bing/tests/analysis-unified-smoke.php
      - name: SEO/GEO saved-evidence recommendations regression
        run: php taxocommerce-google-bing/tests/geo-smoke.php
      - name: Insights Auto Test pre/post regression
        run: php taxocommerce-google-bing/tests/auto-test-smoke.php
      - name: Insights User Guide regression
        run: php taxocommerce-google-bing/tests/user-guide-smoke.php
      - name: Smoke test without network requests
        run: php taxocommerce-google-bing/tests/reporting-smoke.php
      - name: GSC existing credential and property fallback regression
        run: php taxocommerce-google-bing/tests/gsc-connection-fallback-smoke.php
      - name: Merged Connections architecture smoke test
        run: php taxocommerce-google-bing/tests/connections-merged-smoke.php
      - name: Trends manual RSS smoke test
        run: php taxocommerce-google-bing/tests/trends-smoke.php
      - name: Spain-only hierarchical Trends smoke test
        run: php taxocommerce-google-bing/tests/trends-hierarchy-smoke.php
      - name: Hierarchical Trends JavaScript syntax
        run: node --check taxocommerce-google-bing/assets/trends-hierarchy.js
      - name: Trends browser automatic comparison smoke
        run: node taxocommerce-google-bing/tests/trends-hierarchy-browser-smoke.js
      - name: Connection health status smoke test
        run: php taxocommerce-google-bing/tests/connections-status-smoke.php
      - name: Check plugin independence
        run: |
          test -s taxocommerce-google-bing/taxocommerce-google-bing.php
          test -s taxocommerce-google-bing/includes/class-taxocommerce-google-bing-connections.php
          test -s taxocommerce-google-bing/includes/class-taxocommerce-connections-admin.php
          test -s taxocommerce-google-bing/includes/class-taxocommerce-connections-amazon.php
          test -s taxocommerce-google-bing/includes/class-taxocommerce-connections-pinterest.php
          if grep -R 'SEO_SYSTEM_PATH\|SEO_SYSTEM_FILE\|require_once.*seo-taxonomy' taxocommerce-google-bing --include='*.php'; then exit 1; fi
      - name: Build clean WordPress.org distribution
        run: |
          mkdir -p build/taxocommerce-google-bing
          rsync -a \
            --exclude='/tests/' \
            --exclude='/.ftp-deploy-sync-state.json' \
            --exclude='/ftp-deploy-sync-state.json' \
            --exclude='/README.md' \
            --exclude='/.git*' \
            --exclude='/*.bak' \
            taxocommerce-google-bing/ build/taxocommerce-google-bing/
          (cd build && zip -qr ../taxocommerce-google-bing.zip taxocommerce-google-bing)
          unzip -l taxocommerce-google-bing.zip > /tmp/insights-package-manifest.txt
          ! grep -Eq 'taxocommerce-google-bing/tests/|/\\.ftp-deploy-sync-state\\.json|/ftp-deploy-sync-state\\.json' /tmp/insights-package-manifest.txt
          test -s build/taxocommerce-google-bing/includes/class-taxocommerce-google-bing-user-guide.php
          test -s build/taxocommerce-google-bing/includes/analysis/analista-bootstrap.php
      - name: WordPress.org Plugin Check on packaged files
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/taxocommerce-google-bing'
          strict: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: taxocommerce-insights-${{ github.sha }}
          path: taxocommerce-google-bing.zip
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - name: Upload TaxoCommerce Insights to STAGING
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./taxocommerce-google-bing/
          state-name: ../.taxocommerce-google-bing-ftp-state.json
          server-dir: ./wp-content/plugins/taxocommerce-google-bing/
          dry-run: false
          log-level: standard
          exclude: |
            **/.git*
            **/node_modules/**
            **/tests/**
            README.md
            **/*.bak
      - name: Remove legacy hidden FTPS metadata from staging
        env:
          FTP_HOST: ${{ secrets.STAGING_FTP_SERVER }}
          FTP_USER: ${{ secrets.STAGING_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          ftp = ftplib.FTP_TLS()
          ftp.connect(os.environ['FTP_HOST'], 21, timeout=40)
          try:
              ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASS'])
              ftp.prot_p()
              ftp.cwd('./wp-content/plugins/taxocommerce-google-bing/')
              try:
                  ftp.delete('.ftp-deploy-sync-state.json')
                  print('Removed legacy hidden FTP state file from Insights staging directory.')
              except ftplib.error_perm as exc:
                  if not str(exc).startswith('550'):
                      raise
                  print('Legacy hidden state file is absent.')
              # Only known CI scripts are eligible for removal; never remove unknown files.
              known_tests = {
                  'analysis-unified-smoke.php',
                  'auto-test-smoke.php',
                  'connections-merged-smoke.php',
                  'connections-status-smoke.php',
                  'geo-bridge-smoke.php',
                  'geo-smoke.php',
                  'gsc-connection-fallback-smoke.php',
                  'reporting-smoke.php',
                  'trends-hierarchy-browser-smoke.js',
                  'trends-hierarchy-smoke.php',
                  'trends-smoke.php',
                  'user-guide-smoke.php',
              }
              def names():
                  return {
                      entry.rstrip('/').rsplit('/', 1)[-1]
                      for entry in ftp.nlst()
                      if entry.rstrip('/').rsplit('/', 1)[-1] not in ('', '.', '..')
                  }
              if 'tests' in names():
                  ftp.cwd('tests')
                  try:
                      present = names()
                  except ftplib.error_perm as exc:
                      if not str(exc).startswith('550'):
                          raise
                      present = set()
                  unknown = present - known_tests
                  if unknown:
                      raise RuntimeError('Unknown files in Insights STAGING tests directory: ' + repr(sorted(unknown)))
                  for filename in sorted(present):
                      ftp.delete(filename)
                  ftp.cwd('..')
                  ftp.rmd('tests')
                  print('Removed %d obsolete Insights STAGING test files.' % len(present))
              else:
                  print('Insights STAGING tests directory was already absent.')
              if 'tests' in names():
                  raise RuntimeError('Insights STAGING cleanup incomplete: tests/ still exists')
              print('VERIFIED Insights STAGING: tests/ absent.')
          finally:
              ftp.quit()
          PY
