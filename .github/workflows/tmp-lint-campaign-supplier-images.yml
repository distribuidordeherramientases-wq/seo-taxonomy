name: Temporal lint campaign supplier images

on:
  push:
    branches:
      - fix/campaign-supplier-images

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l seo-system/templates/template-campaign-desktop.php
          php -l seo-system/templates/template-campaign-mobile.php
          php -l seo-system/templates/template-helpers.php
