name: Importar STAGING limpio a rama staging

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-staging-hosting-to-github
  cancel-in-progress: false

jobs:
  sync:
    name: STAGING hosting -> GitHub staging
    runs-on: ubuntu-latest

    steps:
      - name: Abrir rama staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Instalar lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Descargar plugin limpio desde STAGING
        env:
          FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          rm -rf /tmp/seo-taxonomy
          mkdir -p /tmp/seo-taxonomy

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes

          mirror --verbose --parallel=4 \
            --exclude-glob .ftpquota \
            --exclude-glob .ftp-deploy-sync-state.json \
            ./wp-content/plugins/seo-taxonomy/ \
            /tmp/seo-taxonomy

          bye
          EOF

      - name: Validar que la descarga es el Build correcto
        run: |
          test -f /tmp/seo-taxonomy/seo-taxonomy.php || {
            echo "ERROR: falta seo-taxonomy.php"
            exit 1
          }

          test -d /tmp/seo-taxonomy/admin || {
            echo "ERROR: falta admin/"
            exit 1
          }

          test -d /tmp/seo-taxonomy/includes || {
            echo "ERROR: falta includes/"
            exit 1
          }

          test -f /tmp/seo-taxonomy/includes/dependiente/seo-dependiente-bootstrap.php || {
            echo "ERROR: falta el bootstrap de Dependiente"
            exit 1
          }

          test -f /tmp/seo-taxonomy/includes/dependiente/entrenador/seo-dependiente-entrenador.php || {
            echo "ERROR: falta el Entrenador"
            exit 1
          }

          test -f /tmp/seo-taxonomy/includes/clasificador/bootstrap.php || {
            echo "ERROR: falta el bootstrap del Clasificador"
            exit 1
          }

          test -f /tmp/seo-taxonomy/includes/clasificador/jobs.php || {
            echo "ERROR: falta Clasificador Jobs"
            exit 1
          }

          echo "Plugin de STAGING validado."
          echo "Archivos descargados:"
          find /tmp/seo-taxonomy -type f | wc -l

      - name: Sustituir rama staging por la copia limpia
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            --exclude='/.gitattributes' \
            --exclude='/README.md' \
            --exclude='/CONTRIBUTING.md' \
            --exclude='/LICENSE' \
            --exclude='/.ftpquota' \
            --exclude='/.ftp-deploy-sync-state.json' \
            /tmp/seo-taxonomy/ ./

          echo "Cambios que se guardaran:"
          git status --short

      - name: Guardar staging limpio en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "La rama staging ya coincide con el hosting."
            exit 0
          fi

          git commit -m "Sincronizar staging limpio desde hosting Build045"
          git push origin HEAD:staging
