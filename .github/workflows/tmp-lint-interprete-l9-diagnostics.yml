name: Temporal lint Interprete L9 diagnostics

on:
  push:
    branches:
      - feature/interprete-l9-diagnostics

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l includes/dependiente/interprete/linguista/lessons/class-dependiente-linguista-lesson9.php
          php -l includes/dependiente/interprete/linguista/seo-dependiente-linguista.php
          php -l includes/dependiente/interprete/seo-dependiente-interprete.php
