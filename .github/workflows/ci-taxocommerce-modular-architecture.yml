name: TaxoCommerce Modular Architecture CI

on:
  pull_request:
    branches: [staging]
    paths:
      - 'taxocommerce-core/**'
      - '.github/tests/taxocommerce-core/**'
      - 'taxocommerce-redirects/**'
      - 'taxocommerce-images/**'
      - 'taxocommerce-vocabulary/**'
      - 'taxocommerce-system-check/**'
      - 'taxocommerce-logistica/**'
      - 'taxocommerce-facturacion/**'
      - '.github/workflows/ci-taxocommerce-modular-architecture.yml'
  push:
    branches: [staging]
    paths:
      - 'taxocommerce-core/**'
      - '.github/tests/taxocommerce-core/**'
      - 'taxocommerce-redirects/**'
      - 'taxocommerce-images/**'
      - 'taxocommerce-vocabulary/**'
      - 'taxocommerce-system-check/**'
      - 'taxocommerce-logistica/**'
      - 'taxocommerce-facturacion/**'
      - '.github/workflows/ci-taxocommerce-modular-architecture.yml'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} modular smoke
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          find taxocommerce-core .github/tests/taxocommerce-core taxocommerce-redirects taxocommerce-images taxocommerce-vocabulary taxocommerce-system-check taxocommerce-logistica taxocommerce-facturacion -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Verify decentralized architecture
        run: |
          php .github/tests/taxocommerce-core/modular-architecture-smoke.php
          php .github/tests/taxocommerce-core/extensions-dashboard-smoke.php
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php standalone
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php core-before
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php core-after
          php taxocommerce-logistica/tests/smoke.php
          php taxocommerce-facturacion/tests/smoke.php
          test -f includes/facturas/dompdf/autoload.inc.php
