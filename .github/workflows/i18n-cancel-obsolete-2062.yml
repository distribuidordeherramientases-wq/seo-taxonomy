name: Stop obsolete i18n translation run (#2062)
on:
  push:
    branches: [fix/i18n-family-2062]
    paths: [.github/workflows/i18n-cancel-obsolete-2062.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded first pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/41484029693/cancel"
