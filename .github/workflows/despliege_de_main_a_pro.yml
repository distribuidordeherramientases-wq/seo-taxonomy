name: STAGING a PRODUCCION
on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths: [.github/workflows/despliege_de_main_a_pro.yml]
  workflow_call:
    inputs:
      source_sha: {type: string, required: true}
      target_plugin: {type: string, required: false, default: ''}
permissions:
  contents: read
concurrency:
  group: taxocommerce-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {ref: staging}
      - name: Copiar STAGING a PRO
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "staging"
          if [ -n "$EXPECTED_SHA" ]; then test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"; fi
          python3 .github/scripts/deploy_pro_simple.py
