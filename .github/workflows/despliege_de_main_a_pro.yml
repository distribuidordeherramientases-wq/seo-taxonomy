name: STAGING a PRODUCCION - toda la familia TaxoCommerce

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxocommerce-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verificar y publicar todos los plugins TaxoCommerce
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar exactamente la revision aprobada de STAGING
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validar despliegue sin modificar PRO
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "staging"
          python3 -m py_compile .github/scripts/deploy_pro_all.py
          python3 -m unittest discover -s .github/tests -p test_deploy_pro_all.py -v

      - name: Copiar todos los archivos publicables de cada plugin y verificar SHA-256 remoto
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/deploy_pro_all.py

      - name: Guardar inventario y comprobaciones, incluso tras un fallo parcial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-taxocommerce-all-${{ github.run_id }}
          path: pro-release-manifest.json
          if-no-files-found: ignore
          retention-days: 30
