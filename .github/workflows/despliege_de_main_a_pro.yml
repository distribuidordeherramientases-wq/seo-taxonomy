name: STAGING a PRODUCCION v0.0.1
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha: {type: string, required: true}
      target_plugin: {type: string, required: false, default: ''}
permissions:
  contents: read
  actions: read
concurrency:
  group: taxocommerce-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 0
      - name: Copiar cambios GitHub STAGING a PRO por FTPS
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "staging"
          if [ -n "$EXPECTED_SHA" ]; then test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"; fi
          python3 .github/scripts/select_pro_release_delta.py --all-changed --output "$RUNNER_TEMP/pro-delta.json"
          python3 .github/scripts/deploy_pro_ftps_native.py "$RUNNER_TEMP/pro-delta.json"
