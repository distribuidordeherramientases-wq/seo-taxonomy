name: Despliegue MAIN (staging) a producción (hosting)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxocommerce-production-deploy
  cancel-in-progress: false

env:
  PRO_SITE_URL: https://www.distribuidordeherramientas.es

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar versión de producción desde MAIN
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Subir TaxoCommerce SEO antiguo a producción por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          dry-run: false
          security: strict
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.bak
            **/*.md
            **/*.pot
            taxocommerce-*/**
            packages/**

      - name: Instalar cliente FTPS y compresor ZIP
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp zip

      - name: Leer plugins TaxoCommerce activos en PRO
        id: active
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2             "$PRO_SITE_URL/wp-json/taxocommerce/v1/deploy-active-modules")"

          modules="$(python3 - "$response" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          modules = payload.get("modules", [])
          if not isinstance(modules, list):
              raise SystemExit("La lista de módulos activos no es válida.")

          eligible = [
              str(module)
              for module in modules
              if str(module) != "taxocommerce-dependiente"
          ]
          print(json.dumps(eligible, separators=(",", ":")))
          PY
          )"

          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Plugins TaxoCommerce elegibles para sincronizar en PRO: $modules"
          echo "Dependiente moderno queda excluido: PRO conserva el Dependiente antiguo durante la comparación."

      - name: Sincronizar solo cambios de plugins TaxoCommerce activos
        shell: bash
        env:
          ACTIVE_MODULES_JSON: ${{ steps.active.outputs.modules }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          mapfile -t active_modules < <(
            python3 - <<'PY'
          import json
          import os

          for module in json.loads(os.environ.get("ACTIVE_MODULES_JSON", "[]")):
              # Durante la comparación, PRO conserva deliberadamente el
              # Dependiente del plugin antiguo. El moderno se valida solo en
              # STAGING y no se sincroniza a producción.
              if module == "taxocommerce-dependiente":
                  continue
              print(module)
          PY
          )

          if [ "${#active_modules[@]}" -eq 0 ]; then
            echo "No hay plugins TaxoCommerce modulares elegibles para sincronizar en PRO."
            echo "TaxoCommerce Dependiente moderno queda excluido mientras se compara con el Dependiente antiguo."
            exit 0
          fi

          echo "Protección de comparación: taxocommerce-dependiente moderno NO se despliega en PRO."

          allowed_modules=(
            taxocommerce-core
            taxocommerce-images
            taxocommerce-import-export
            taxocommerce-system-check
            taxocommerce-templates
            taxocommerce-faqs
            taxocommerce-vocabulary
            taxocommerce-google-bing
            taxocommerce-auditor
            taxocommerce-redirects
          )

          is_allowed() {
            local candidate="$1"
            local allowed
            for allowed in "${allowed_modules[@]}"; do
              if [ "$candidate" = "$allowed" ]; then
                return 0
              fi
            done
            return 1
          }

          for module in "${active_modules[@]}"; do
            if ! is_allowed "$module"; then
              echo "::error::PRO devolvió un módulo no permitido: $module"
              exit 1
            fi

            if [ ! -f "$module/$module.php" ]; then
              echo "::error::El módulo activo $module no existe correctamente en MAIN."
              exit 1
            fi
          done

          deploy_token="$(openssl rand -hex 32)"
          token_hash="$(printf '%s' "$deploy_token" | sha256sum | awk '{print $1}')"
          handoff=".taxocommerce-deploy/$GITHUB_RUN_ID"

          cleanup_handoff() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<EOF || true
          set cmd:fail-exit no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          rm -r "$handoff"
          bye
          EOF
          }
          trap cleanup_handoff EXIT

          : > /tmp/taxocommerce-deploy-marker

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          mkdir -p "$handoff"
          put /tmp/taxocommerce-deploy-marker -o "$handoff/.token-$token_hash"
          bye
          EOF

          for module in "${active_modules[@]}"; do
            package="/tmp/$module.zip"
            rm -f "$package"

            echo "Empaquetando $module sin tests ni documentación..."
            (
              cd "$module"
              zip -qr "$package" . \
                -x 'tests/*' \
                -x 'readme.txt' \
                -x '*.md' \
                -x '*.pot' \
                -x 'node_modules/*' \
                -x '*.bak'
            )

            echo "Subiendo un único paquete temporal para $module..."
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          put "$package" -o "$handoff/$module.zip"
          bye
          EOF
          done

          http_code="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            -o /tmp/taxocommerce-deploy-response.json \
            -w '%{http_code}' \
            -X POST \
            --data-urlencode "run_id=$GITHUB_RUN_ID" \
            --data-urlencode "deploy_token=$deploy_token" \
            "$PRO_SITE_URL/wp-json/taxocommerce/v1/deploy-active-modules")"

          if [[ "$http_code" != 2* ]]; then
            echo "::error::WordPress PRO rechazó la sincronización con HTTP $http_code"
            cat /tmp/taxocommerce-deploy-response.json || true
            exit 1
          fi

          export DEPLOY_RESPONSE="$(cat /tmp/taxocommerce-deploy-response.json)"

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          active = json.loads(os.environ.get("ACTIVE_MODULES_JSON", "[]"))
          payload = json.loads(os.environ["DEPLOY_RESPONSE"])
          updated = payload.get("updated", [])

          updated_by_slug = {
              str(item.get("slug", "")): item
              for item in updated
              if isinstance(item, dict)
          }

          if set(updated_by_slug) != set(active):
              raise SystemExit(
                  "PRO no confirmó exactamente los plugins activos. "
                  f"Activos={active}; actualizados={sorted(updated_by_slug)}"
              )

          for slug in active:
              main_file = Path(slug) / f"{slug}.php"
              text = main_file.read_text(encoding="utf-8", errors="replace")
              match = re.search(r"^\s*\*\s*Version:\s*([^\r\n]+)", text, re.MULTILINE)
              expected = match.group(1).strip() if match else ""

              item = updated_by_slug[slug]
              received = str(item.get("version", ""))
              changed = [str(path) for path in item.get("changed", [])]
              unchanged = int(item.get("unchanged", 0))

              if not expected or received != expected:
                  raise SystemExit(
                      f"Versión remota incorrecta para {slug}: "
                      f"esperada={expected!r}; recibida={received!r}"
                  )

              print(f"{slug}: PRO verificado en versión {received}")
              print(f"{slug}: {len(changed)} archivo(s) actualizado(s), {unchanged} sin cambios")
              for path in changed:
                  print(f"  ACTUALIZADO: {path}")
          PY

          trap - EXIT
          cleanup_handoff

          echo "Despliegue modular terminado: solo se han sobrescrito archivos cuyo contenido cambió."
