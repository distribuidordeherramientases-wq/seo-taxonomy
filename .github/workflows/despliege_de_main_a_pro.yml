
name: STAGING a PRODUCCION

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: taxocommerce-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo de STAGING
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Copiar cambios a PRO
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

        run: |
          set -euo pipefail

          python3 .github/scripts/select_pro_release_delta.py \
            --all-changed \
            --output "$RUNNER_TEMP/cambios.json"

          python3 .github/scripts/deploy_pro_ftps_native.py \
            "$RUNNER_TEMP/cambios.json"
