name: Despliegue MAIN (staging) a producción (hosting)

on:
  workflow_dispatch:
    inputs:
      approved_cleanup_sha256:
        description: 'Approved SHA-256 from a prior PRO comparison; blank = report only'
        required: false
        type: string
        default: ''


permissions:
  contents: read

concurrency:
  group: taxocommerce-production-deploy
  cancel-in-progress: false

env:
  PRO_SITE_URL: https://www.distribuidordeherramientas.es

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # The workflow lives on MAIN, but the deployable source is STAGING.
      # A workflow PR merged to MAIN must not silently deploy stale MAIN code.
      - name: Checkout validated source from STAGING
        uses: actions/checkout@v6
        with:
          ref: staging

      - name: Record deployed source revision
        run: |
          echo "PRO source: staging @ $(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "staging"

      - name: Validate PRO reconciliation and protection rules
        run: |
          python3 -m py_compile .github/scripts/reconcile_taxocommerce_pro.py
          python3 -m unittest discover -s .github/scripts/tests -p 'test_reconcile_taxocommerce_pro.py' -v

      - name: Validate all TaxoCommerce version headers and readmes
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          modules = sorted(
              folder for folder in Path('.').glob('taxocommerce-*')
              if folder.is_dir() and (folder / (folder.name + '.php')).is_file()
          )
          if not modules:
              raise SystemExit("No TaxoCommerce modules available in STAGING")
          for module in modules:
              main = (module / (module.name + '.php')).read_text(encoding="utf-8")
              readme_file = module / 'readme.txt'
              if not readme_file.is_file():
                  raise SystemExit(f"{module.name}: missing readme.txt, abort before PRO")
              readme = readme_file.read_text(encoding="utf-8")
              version = re.search(r"(?mi)^\s*\*\s*Version:\s*(\S+)", main)
              stable = re.search(r"(?mi)^Stable tag:\s*(\S+)", readme)
              if not version or not stable or version.group(1) != stable.group(1):
                  raise SystemExit(f"{module.name}: plugin Version and readme Stable tag differ")
              print(f"{module.name}: Version/Stable tag {version.group(1)} OK")
          print("Validated modules:", len(modules))
          PY

      - name: Subir TaxoCommerce SEO antiguo a producción por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          dry-run: false
          security: strict
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.bak
            **/*.md
            **/*.pot
            taxocommerce-*/**
            packages/**
            wp-content/uploads/**
            **/uploads/**
            **/.ftp-deploy-sync-state.json

      - name: Instalar cliente FTPS y compresor ZIP
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp zip

      - name: Descubrir plugins TaxoCommerce disponibles en MAIN
        id: family
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t modules < <(
            find . -maxdepth 1 -mindepth 1 -type d -name 'taxocommerce-*' -printf '%f\n' | sort
          )

          valid_modules=()
          for module in "${modules[@]}"; do
            if [[ "$module" =~ ^taxocommerce-[a-z0-9-]+$ ]] && [ -f "$module/$module.php" ]; then
              valid_modules+=("$module")
            fi
          done

          if [ "${#valid_modules[@]}" -eq 0 ]; then
            echo "::error::No se encontraron plugins TaxoCommerce válidos en STAGING."
            exit 1
          fi

          modules_json="$(python3 - "${valid_modules[@]}" <<'PY'
          import json
          import sys
          print(json.dumps(sys.argv[1:], separators=(",", ":")))
          PY
          )"

          echo "modules=$modules_json" >> "$GITHUB_OUTPUT"
          echo "Plugins TaxoCommerce disponibles en STAGING: $modules_json"

      - name: Leer plugins TaxoCommerce instalados en PRO
        id: installed
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2             "$PRO_SITE_URL/wp-json/taxocommerce/v1/deploy-active-modules")"

          modules="$(python3 - "$response" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          modules = payload.get("modules", [])
          if not isinstance(modules, list):
              raise SystemExit("La lista de módulos instalados no es válida.")

          print(json.dumps([str(module) for module in modules], separators=(",", ":")))
          PY
          )"

          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Plugins TaxoCommerce instalados para sincronizar en PRO: $modules"

      - name: Preparar en PRO los ZIP de plugins todavía no instalados
        shell: bash
        env:
          ALL_MODULES_JSON: ${{ steps.family.outputs.modules }}
          INSTALLED_MODULES_JSON: ${{ steps.installed.outputs.modules }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          mapfile -t all_modules < <(
            python3 - <<'PY'
          import json
          import os
          for module in json.loads(os.environ.get("ALL_MODULES_JSON", "[]")):
              print(module)
          PY
          )

          mapfile -t installed_modules < <(
            python3 - <<'PY'
          import json
          import os
          for module in json.loads(os.environ.get("INSTALLED_MODULES_JSON", "[]")):
              print(module)
          PY
          )

          declare -A installed_lookup=()
          for module in "${installed_modules[@]}"; do
            installed_lookup["$module"]=1
          done

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<EOF
          set cmd:fail-exit no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          mkdir -p "wp-content/uploads/taxocommerce-core/plugins"
          set cmd:fail-exit yes
          cd "wp-content/uploads/taxocommerce-core/plugins"
          bye
          EOF

          prepared=0
          for module in "${all_modules[@]}"; do
            if [ -n "${installed_lookup[$module]:-}" ]; then
              echo "$module ya está instalado en PRO: se actualizará directamente y no se instalará desde ZIP."
              continue
            fi

            if [ "$module" = "taxocommerce-facturacion" ]; then
              echo "Including the same Dompdf bundle from the historical module in Billing installer..."
              test -f includes/facturas/dompdf/autoload.inc.php
              rm -rf "$module/includes/dompdf"
              cp -a includes/facturas/dompdf "$module/includes/dompdf"
            fi

            package="/tmp/$module-installable.zip"
            rm -f "$package"

            echo "Preparando ZIP instalable para $module..."
            zip -qr "$package" "$module" \
              -x "$module/tests/*" \
                 "$module/uploads/*" \
                 "$module/*.md" \
                 "$module/*.pot" \
                 "$module/node_modules/*" \
                 "$module/*.bak"
            # Every plugin ships its own current readme, not only Core.
            unzip -Z1 "$package" | grep -Fx "$module/readme.txt" >/dev/null

            unzip -t "$package" >/dev/null
            unzip -Z1 "$package" | grep -Fx "$module/$module.php" >/dev/null

            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          put "$package" -o "wp-content/uploads/taxocommerce-core/plugins/$module.zip"
          bye
          EOF

            echo "$module: ZIP disponible en uploads/taxocommerce-core/plugins/$module.zip"
            prepared=$((prepared + 1))
          done

          echo "ZIP de plugins no instalados preparados: $prepared"

      - name: Sincronizar cambios de todos los plugins TaxoCommerce instalados
        shell: bash
        env:
          ALL_MODULES_JSON: ${{ steps.family.outputs.modules }}
          INSTALLED_MODULES_JSON: ${{ steps.installed.outputs.modules }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          mapfile -t installed_modules < <(
            python3 - <<'PY'
          import json
          import os

          for module in json.loads(os.environ.get("INSTALLED_MODULES_JSON", "[]")):
              print(module)
          PY
          )

          if [ "${#installed_modules[@]}" -eq 0 ]; then
            echo "No hay plugins TaxoCommerce instalados para actualizar en PRO. Los ZIP de los no instalados ya se han preparado."
            exit 0
          fi

          mapfile -t allowed_modules < <(
            python3 - <<'PY'
          import json
          import os
          for module in json.loads(os.environ["ALL_MODULES_JSON"]):
              print(module)
          PY
          )

          if [ "${#allowed_modules[@]}" -eq 0 ]; then
            echo "::error::La lista de módulos de STAGING está vacía; comprueba ALL_MODULES_JSON antes de escribir en PRO."
            exit 1
          fi
          echo "Validación previa: ${#installed_modules[@]} instalados en PRO; ${#allowed_modules[@]} disponibles en MAIN."

          declare -A allowed_lookup=()
          for module in "${allowed_modules[@]}"; do
            allowed_lookup["$module"]=1
          done

          for module in "${installed_modules[@]}"; do
            if [ -z "${allowed_lookup[$module]:-}" ]; then
              echo "::error::PRO devolvió un módulo TaxoCommerce instalado que no existe correctamente en STAGING: $module"
              exit 1
            fi

            if [ ! -f "$module/$module.php" ]; then
              echo "::error::El módulo instalado $module no existe correctamente en STAGING."
              exit 1
            fi
          done
          deploy_token="$(openssl rand -hex 32)"
          token_hash="$(printf '%s' "$deploy_token" | sha256sum | awk '{print $1}')"
          handoff=".taxocommerce-deploy/$GITHUB_RUN_ID"

          cleanup_handoff() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<EOF || true
          set cmd:fail-exit no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          rm -r "$handoff"
          bye
          EOF
          }
          trap cleanup_handoff EXIT

          # Prepare the handoff directory only. Never expose the token until
          # ALL plugin ZIPs have been uploaded (slow transfers can take minutes).
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<EOF
          set cmd:fail-exit no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          mkdir -p "$handoff"
          set cmd:fail-exit yes
          cd "$handoff"
          bye
          EOF

          for module in "${installed_modules[@]}"; do
            package="/tmp/$module.zip"
            rm -f "$package"

            if [ "$module" = "taxocommerce-facturacion" ]; then
              echo "Including the same Dompdf bundle from the historical module in Billing..."
              test -f includes/facturas/dompdf/autoload.inc.php
              rm -rf "$module/includes/dompdf"
              cp -a includes/facturas/dompdf "$module/includes/dompdf"
            fi

            echo "Empaquetando $module sin tests ni datos, conservando readme.txt..."
            (
              cd "$module"
              zip -qr "$package" . \
                -x 'tests/*' \
                -x 'uploads/*' \
                -x '*.md' \
                -x '*.pot' \
                -x 'node_modules/*' \
                -x '*.bak'
            )
            unzip -t "$package" >/dev/null
            unzip -Z1 "$package" | grep -Fx "$module.php" >/dev/null
            unzip -Z1 "$package" | grep -Fx 'readme.txt' >/dev/null

            echo "Subiendo un único paquete temporal para $module..."
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          put "$package" -o "$handoff/$module.zip"
          bye
          EOF
          done

          # The REST permission callback requires this marker to exist. Upload
          # and read back the marker immediately BEFORE the POST, not before the
          # potentially lengthy FTPS loop. Do not log the secret token.
          : > /tmp/taxocommerce-deploy-marker
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$handoff"
          put /tmp/taxocommerce-deploy-marker -o ".token-$token_hash"
          get ".token-$token_hash" -o /tmp/taxocommerce-deploy-marker-verified
          bye
          EOF
          if ! cmp -s /tmp/taxocommerce-deploy-marker /tmp/taxocommerce-deploy-marker-verified; then
            echo "::error::El marcador FTPS de autorización no se ha podido verificar."
            exit 1
          fi

          http_code="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            -o /tmp/taxocommerce-deploy-response.json \
            -w '%{http_code}' \
            -X POST \
            --data-urlencode "run_id=$GITHUB_RUN_ID" \
            --data-urlencode "deploy_token=$deploy_token" \
            "$PRO_SITE_URL/wp-json/taxocommerce/v1/deploy-active-modules")"

          if [[ "$http_code" != 2* ]]; then
            echo "::error::WordPress PRO rechazó la sincronización con HTTP $http_code"
            cat /tmp/taxocommerce-deploy-response.json || true
            exit 1
          fi

          export DEPLOY_RESPONSE="$(cat /tmp/taxocommerce-deploy-response.json)"

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          installed = json.loads(os.environ.get("INSTALLED_MODULES_JSON", "[]"))
          payload = json.loads(os.environ["DEPLOY_RESPONSE"])
          updated = payload.get("updated", [])

          updated_by_slug = {
              str(item.get("slug", "")): item
              for item in updated
              if isinstance(item, dict)
          }

          if set(updated_by_slug) != set(installed):
              raise SystemExit(
                  "PRO no confirmó exactamente los plugins instalados. "
                  f"Instalados={installed}; actualizados={sorted(updated_by_slug)}"
              )

          for slug in installed:
              main_file = Path(slug) / f"{slug}.php"
              text = main_file.read_text(encoding="utf-8", errors="replace")
              match = re.search(r"^\s*\*\s*Version:\s*([^\r\n]+)", text, re.MULTILINE)
              expected = match.group(1).strip() if match else ""

              item = updated_by_slug[slug]
              received = str(item.get("version", ""))
              changed = [str(path) for path in item.get("changed", [])]
              unchanged = int(item.get("unchanged", 0))

              if not expected or received != expected:
                  raise SystemExit(
                      f"Versión remota incorrecta para {slug}: "
                      f"esperada={expected!r}; recibida={received!r}"
                  )

              print(f"{slug}: PRO verificado en versión {received}")
              print(f"{slug}: {len(changed)} archivo(s) actualizado(s), {unchanged} sin cambios")
              for path in changed:
                  print(f"  ACTUALIZADO: {path}")
          PY

          # On HTTP 2xx WordPress already removed the handoff directory.
          # Keep EXIT cleanup for failures, not a second rm on success (550).
          trap - EXIT

          echo "Despliegue modular terminado: solo se han sobrescrito archivos cuyo contenido cambió."

      - name: Remove obsolete deployment artifacts from installed TaxoCommerce plugins
        # Runs only AFTER WordPress confirms every installed plugin was updated.
        # Never recursively mirror --delete: unmanaged files and uploads are preserved.
        if: ${{ steps.installed.outputs.modules != '[]' }}
        shell: bash
        env:
          INSTALLED_MODULES_JSON: ${{ steps.installed.outputs.modules }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib
          import json
          import os
          import re
          from pathlib import Path

          modules = json.loads(os.environ["INSTALLED_MODULES_JSON"])
          if not isinstance(modules, list):
              raise SystemExit("Invalid installed plugin list")

          legacy_core = (
              "anomalies-smoke.php", "architecture-report-smoke.php",
              "auto-test-navigation-smoke.php", "auto-test-smoke.php",
              "content-inventory-smoke.php", "country-scope-smoke.php",
              "editorial-guide-smoke.php", "extensions-dashboard-smoke.php",
              "family-menu-smoke.php", "hierarchy-country-schema-smoke.php",
              "menu-editor-smoke.php", "modular-architecture-smoke.php",
              "user-guide-smoke.php",
          )
          legacy_images = (
              "early-i18n-smoke.php", "functional-contract.php",
              "audit-load-smoke.php", "auto-test-smoke.php", "manual-smoke.php",
              "audit-browser-smoke.js",
          )
          ftp = ftplib.FTP_TLS(timeout=45)
          ftp.connect(os.environ["FTP_HOST"], 21)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASS"])
          ftp.prot_p()

          def remove_file(remote):
              try:
                  ftp.delete(remote)
                  print("REMOVED obsolete deployment artifact:", remote)
              except ftplib.error_perm as exc:
                  if not str(exc).startswith("550"):
                      raise

          def remove_dir_if_empty(remote):
              try:
                  ftp.rmd(remote)
              except ftplib.error_perm as exc:
                  if not str(exc).startswith("550"):
                      raise
                  # Distinguish an absent directory from one that is non-empty.
                  try:
                      ftp.cwd(remote)
                  except ftplib.error_perm as missing:
                      if not str(missing).startswith("550"):
                          raise
                      return
                  ftp.cwd("..")
                  raise RuntimeError(
                      "Unmanaged files remain in " + remote +
                      "; preserved, manual review required before deleting."
                  ) from exc

          try:
              ftp.cwd("./wp-content/plugins/")
              for slug in modules:
                  if not isinstance(slug, str) or not re.fullmatch(r"taxocommerce-[a-z0-9-]+", slug):
                      raise RuntimeError("Unrecognized plugin slug from production")
                  source = Path(slug)
                  if not (source / (slug + ".php")).is_file():
                      raise RuntimeError("Plugin source missing in staging: " + slug)
                  tests = source / "tests"
                  files = set()
                  dirs = set()
                  if tests.is_dir():
                      for file in tests.rglob("*"):
                          relative = file.relative_to(source).as_posix()
                          if file.is_symlink():
                              raise RuntimeError("Unsafe symbolic link in tests: " + relative)
                          if file.is_file():
                              files.add(relative)
                          elif file.is_dir():
                              dirs.add(relative)
                  if slug == "taxocommerce-core":
                      files.update("tests/" + name for name in legacy_core)
                  if slug == "taxocommerce-images":
                      files.update("tests/" + name for name in legacy_images)

                  ftp.cwd(slug)
                  remove_file(".ftp-deploy-sync-state.json")
                  for name in sorted(files):
                      if not name.startswith("tests/") or ".." in Path(name).parts:
                          raise RuntimeError("Unsafe tests path: " + name)
                      remove_file(name)
                  for dirname in sorted(dirs, key=lambda part: part.count("/"), reverse=True):
                      remove_dir_if_empty(dirname)
                  remove_dir_if_empty("tests")
                  ftp.cwd("..")
                  print(slug, ": known obsolete developer files cleaned; runtime files preserved.")
          finally:
              ftp.quit()
          PY

      - name: Compare deployed ZIPs against PRO files and propose removals
        env:
          INSTALLED_MODULES_JSON: ${{ steps.installed.outputs.modules }}
          TC_FTP_HOST: ${{ secrets.FTP_SERVER }}
          TC_FTP_USER: ${{ secrets.FTP_USERNAME }}
          TC_FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          TC_APPROVED_CLEANUP_SHA256: ${{ inputs.approved_cleanup_sha256 }}
        run: python3 .github/scripts/reconcile_taxocommerce_pro.py plan

      - name: Publish proposed obsolete files for manual review
        uses: actions/upload-artifact@v4
        with:
          name: taxocommerce-pro-obsolete-file-proposal
          path: .taxocommerce-cleanup/plan.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve backup of explicitly approved removals before deletion
        if: ${{ inputs.approved_cleanup_sha256 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: taxocommerce-pro-obsolete-file-backup
          path: |
            .taxocommerce-cleanup/backup.zip
            .taxocommerce-cleanup/plan.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove only files in the approved PRO comparison
        if: ${{ inputs.approved_cleanup_sha256 != '' }}
        env:
          INSTALLED_MODULES_JSON: ${{ steps.installed.outputs.modules }}
          TC_FTP_HOST: ${{ secrets.FTP_SERVER }}
          TC_FTP_USER: ${{ secrets.FTP_USERNAME }}
          TC_FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          TC_APPROVED_CLEANUP_SHA256: ${{ inputs.approved_cleanup_sha256 }}
        run: python3 .github/scripts/reconcile_taxocommerce_pro.py apply
