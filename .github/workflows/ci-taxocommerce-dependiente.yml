name: TaxoCommerce Dependiente CI

on:
  pull_request:
    paths:
      - 'taxocommerce-dependiente/**'
      - '.github/workflows/ci-taxocommerce-dependiente.yml'
  push:
    branches: [staging]
    paths:
      - 'taxocommerce-dependiente/**'
      - '.github/workflows/ci-taxocommerce-dependiente.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} lint and learning smoke
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find taxocommerce-dependiente -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
      - name: User and technical manuals regression
        run: php taxocommerce-dependiente/tests/manual-smoke.php
      - name: Grouped Auto Test regression
        run: php taxocommerce-dependiente/tests/auto-test-smoke.php
      - name: Auditable learning regression guards
        run: php taxocommerce-dependiente/tests/learning-smoke.php
      - name: Per-lesson quality thresholds and explicit owner acceptance
        run: php taxocommerce-dependiente/tests/quality-thresholds-smoke.php
      - name: M11 scheduler, lock ownership and logging regression
        run: |
          php taxocommerce-dependiente/tests/m11-observability-smoke.php
          php taxocommerce-dependiente/tests/m11-scheduler-smoke.php
      - name: L9 snapshot language and ranking regression
        run: php taxocommerce-dependiente/tests/l9-query-regression.php
      - name: Original Interpreter / Linguist parity regression
        run: php taxocommerce-dependiente/tests/original-interpreter-parity.php
      - name: Historical product-ranking regression (diagnostic only, not M11 gate)
        run: php taxocommerce-dependiente/tests/m11-runtime-regression.php
      - name: L10 evaluator provenance regression
        run: php taxocommerce-dependiente/tests/l10-evaluator-provenance.php
      - name: L6 FAQs legacy and modern source regression
        run: php taxocommerce-dependiente/tests/faq-source-smoke.php
      - name: No separate Academy or Trainer UI
        run: |
          ! grep --line-number --fixed-strings 'TaxoCommerce Dependiente · Academia' taxocommerce-dependiente/includes/class-tcd-admin.php taxocommerce-dependiente/taxocommerce-dependiente.php
          ! grep --line-number --fixed-strings 'Entrenador' taxocommerce-dependiente/includes/class-tcd-admin.php taxocommerce-dependiente/taxocommerce-dependiente.php
