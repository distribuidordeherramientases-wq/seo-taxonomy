name: Organizar issues TaxoCommerce 2.4.1

on:
  push:
    branches:
      - ops/milestone-2.4.1
    paths:
      - '.github/workflows/ops-milestone-241.yml'

permissions:
  contents: read
  issues: write

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure milestone 2.4.1 and assign tracked issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number=$(gh api "repos/$GH_REPO/milestones?state=all&per_page=100" \
            --jq '.[] | select(.title == "Milestone 2.4.1" or .title == "2.4.1") | .number' | head -n 1)
          if [ -z "$number" ]; then
            number=$(gh api --method POST "repos/$GH_REPO/milestones" \
              -f title="Milestone 2.4.1" \
              -f description="TaxoCommerce: integración modular, editor y Vocabulary, FAQs, System Check, Auditor e Images; validación y QA." \
              --jq '.number')
            echo "Milestone creado: $number"
          else
            echo "Milestone existente: $number"
          fi

          for issue in 1123 1133 1136 1138 1148 1149 1184 1185 1186 1187 1188 1189 1190 1191 1192 1193 1194 1195; do
            current_title=$(gh api "repos/$GH_REPO/issues/$issue" --jq '.title')
            if [[ "$current_title" == "2.4.0:"* ]]; then
              next_title="2.4.1:$(printf '%s' "$current_title" | sed 's/^2\.4\.0://')"
              gh api --method PATCH "repos/$GH_REPO/issues/$issue" \
                -F "milestone=$number" -f "title=$next_title" --silent
            else
              gh api --method PATCH "repos/$GH_REPO/issues/$issue" \
                -F "milestone=$number" --silent
            fi
            echo "#$issue -> milestone $number"
          done

          echo "Milestone URL: https://github.com/$GH_REPO/milestone/$number"
          echo "Verificación de asignaciones:"
          for issue in 1123 1133 1136 1138 1148 1149 1184 1185 1186 1187 1188 1189 1190 1191 1192 1193 1194 1195; do
            assigned=$(gh api "repos/$GH_REPO/issues/$issue" --jq '.milestone.number')
            if [[ "$assigned" != "$number" ]]; then
              echo "ERROR: issue #$issue no tiene el milestone esperado"
              exit 1
            fi
          done
          echo "Todas las 18 incidencias están asignadas."
