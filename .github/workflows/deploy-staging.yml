name: Despliegue inmediado a STAGING

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy plugin to STAGING
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Deploy TaxoCommerce SEO to STAGING
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}

          protocol: ftps
          port: 21

          local-dir: ./
          server-dir: ./wp-content/plugins/seo-taxonomy/

          dry-run: false
          log-level: verbose

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            taxocommerce-core/**
            taxocommerce-images/**
            taxocommerce-import-export/**
            packages/**
            **/node_modules/**
            **/*.bak
            **/*.md
            **/*.pot


      - name: Deploy TaxoCommerce Core to STAGING
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}

          protocol: ftps
          port: 21

          local-dir: ./taxocommerce-core/
          server-dir: ./wp-content/plugins/taxocommerce-core/

          dry-run: false
          log-level: verbose

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.bak
            **/*.md
            **/*.pot


      - name: Deploy TaxoCommerce Images to STAGING
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}

          protocol: ftps
          port: 21

          local-dir: ./taxocommerce-images/
          server-dir: ./wp-content/plugins/taxocommerce-images/

          dry-run: false
          log-level: verbose

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.bak
            **/*.md
            **/*.pot


      - name: Deploy TaxoCommerce Import-Export to STAGING
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}

          protocol: ftps
          port: 21

          local-dir: ./taxocommerce-import-export/
          server-dir: ./wp-content/plugins/taxocommerce-import-export/

          dry-run: false
          log-level: verbose

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.bak
            **/*.md
            **/*.pot


      - name: Prepare TaxoCommerce Vocabulary package
        run: |
          rm -rf .deploy-vocabulary
          mkdir -p .deploy-vocabulary
          unzip -q packages/taxocommerce-vocabulary-0.2.0.zip -d .deploy-vocabulary
          test -f .deploy-vocabulary/taxocommerce-vocabulary/taxocommerce-vocabulary.php

      - name: Deploy TaxoCommerce Vocabulary to STAGING
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}

          protocol: ftps
          port: 21

          local-dir: ./.deploy-vocabulary/taxocommerce-vocabulary/
          server-dir: ./wp-content/plugins/taxocommerce-vocabulary/

          dry-run: false
          log-level: verbose

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.bak
            **/*.md
            **/*.pot
