name: Immediate deployment to STAGING

on:
  workflow_call:
    inputs:
      full_sync:
        description: 'Allow a full reconciliation when called by the gated pipeline'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Reconciliar todos los plugins instalados (solo manual; normalmente NO)'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'taxocommerce-*/**'
      - '.github/scripts/deploy_staging_delta.py'
      - '.github/tests/test_pro_historic_modular_workflow.py'
      - '.github/workflows/despliege_de_main_a_pro.yml'
      - '.github/tests/test_deploy_staging_delta.py'
      - '.github/scripts/audit_core_dual_sites.py'
      - '.github/tests/test_audit_core_dual_sites.py'
      - '.github/workflows/deploy-staging.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: taxocommerce-staging-focazul-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate incremental deployment and Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate delta script and regression tests
        run: |
          python3 -m py_compile .github/scripts/deploy_staging_delta.py
          python3 -m unittest discover -s .github/tests -p test_deploy_staging_delta.py -v
          python3 -m unittest discover -s .github/tests -p test_pro_historic_modular_workflow.py -v
          python3 -m py_compile .github/scripts/audit_core_dual_sites.py
          python3 -m unittest discover -s .github/tests -p test_audit_core_dual_sites.py -v
      - name: Verify all 20 Autocheck JSON contracts and PHP syntax
        run: |
          set -euo pipefail
          php -l .github/tests/taxocommerce-autocheck-family.php
          php .github/tests/taxocommerce-autocheck-family.php
          find taxocommerce-* -type f -name '*.php' -not -path '*/tests/*' -not -path '*/templates/*' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done
          php taxocommerce-connections/tests/connections-smoke.php
          php taxocommerce-auditor/tests/auto-test-manual-smoke.php
          php taxocommerce-database/tests/auto-test-smoke.php
          php taxocommerce-system-check/tests/processes-smoke.php
          php taxocommerce-dependiente/tests/auto-test-smoke.php
          php -l taxocommerce-dependiente/tests/clean-install-smoke.php
          php taxocommerce-dependiente/tests/clean-install-smoke.php
          php -l taxocommerce-dependiente/tests/first-install-catalog-smoke.php
          php taxocommerce-dependiente/tests/first-install-catalog-smoke.php
          php -l taxocommerce-dependiente/tests/no-products-runtime-smoke.php
          php taxocommerce-dependiente/tests/no-products-runtime-smoke.php
          php -l taxocommerce-dependiente/tests/empty-lesson-progression-smoke.php
          php taxocommerce-dependiente/tests/empty-lesson-progression-smoke.php
          php -l taxocommerce-dependiente/tests/optional-sources-empty-smoke.php
          php taxocommerce-dependiente/tests/optional-sources-empty-smoke.php
          php -l taxocommerce-dependiente/tests/m11-checkpoint-large-lexicon.php
          php taxocommerce-dependiente/tests/m11-checkpoint-large-lexicon.php
          php taxocommerce-distribution/tests/manual-autocheck-smoke.php
          php taxocommerce-facturacion/tests/manual-autotest-smoke.php
          php taxocommerce-faqs/tests/auto-test-smoke.php
          php taxocommerce-google-bing/tests/auto-test-smoke.php
          php taxocommerce-google-bing/tests/indexnow-smoke.php
          php taxocommerce-google-bing/tests/indexnow-i18n-smoke.php
          php taxocommerce-images/tests/auto-test-smoke.php
          php taxocommerce-import-export/tests/auto-test-smoke.php
          php taxocommerce-logistica/tests/auto-test-smoke.php
          php taxocommerce-redirects/tests/auto-test-smoke.php
          php taxocommerce-scrappers/tests/manual-autotest-smoke.php
          php taxocommerce-social/tests/auto-test-manual-smoke.php
          php taxocommerce-suppliers/tests/smoke.php
          php taxocommerce-suppliers/tests/template-creation-smoke.php
          php taxocommerce-system-check/tests/auto-test-guide-smoke.php
          php taxocommerce-templates/tests/smoke.php
          php taxocommerce-templates/tests/bing-meta-head-smoke.php
          php taxocommerce-templates/tests/manual-smoke.php
          php -l taxocommerce-templates/tests/filesystem-smoke.php
          php taxocommerce-templates/tests/filesystem-smoke.php
          find taxocommerce-templates/templates -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done
          php -l taxocommerce-templates/tests/sql-identifiers-smoke.php
          php taxocommerce-templates/tests/sql-identifiers-smoke.php
          php -l taxocommerce-templates/tests/plugincheck-warnings-smoke.php
          php taxocommerce-templates/tests/plugincheck-warnings-smoke.php
          php taxocommerce-vocabulary/tests/auto-test-manual-smoke.php
          php -l taxocommerce-vocabulary/includes/class-tcv-extractor.php
          php -l taxocommerce-vocabulary/tests/classifier-extraction-smoke.php
          php taxocommerce-vocabulary/tests/classifier-extraction-smoke.php
      - name: Import-Export native category CSV contracts and PHP syntax
        run: |
          php -l taxocommerce-import-export/includes/class-taxocommerce-import-export-csv.php
          php -l taxocommerce-import-export/includes/class-taxocommerce-import-export-exporter.php
          php -l taxocommerce-import-export/includes/class-taxocommerce-import-export-batch.php
          php -l taxocommerce-import-export/includes/class-taxocommerce-import-export-auto-test.php
          php taxocommerce-import-export/tests/native-category-csv-smoke.php
          php taxocommerce-import-export/tests/country-csv-smoke.php
          php taxocommerce-import-export/tests/batch-queue-smoke.php
          node --check taxocommerce-import-export/assets/exporter.js
      - name: Validate all TaxoCommerce binary gettext catalogs
        run: |
          python3 -m unittest discover -s .github/tests -p test_verify_mo_catalogs.py -v
          python3 .github/scripts/verify_mo_catalogs.py --repo
      - name: Core PHP syntax and regression tests
        run: |
          php -l taxocommerce-core/taxocommerce-core.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-anomalies.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-country.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-hierarchy.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-hierarchy-classic.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-menu.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-menu-editor.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-auto-test.php
          php -l .github/tests/taxocommerce-core/autocheck-json-smoke.php
          php -l taxocommerce-distribution/includes/sitemaps/batch-worker.php
          php -l taxocommerce-distribution/includes/sitemaps/engine.php
          php -l taxocommerce-distribution/includes/admin.php
          php -l taxocommerce-distribution/tests/sitemap-publish-state-smoke.php
          php taxocommerce-distribution/tests/sitemap-publish-state-smoke.php
          php .github/tests/taxocommerce-core/auto-test-smoke.php
          php -l .github/tests/taxocommerce-core/autocheck-functional-smoke.php
          php .github/tests/taxocommerce-core/autocheck-functional-smoke.php
          php .github/tests/taxocommerce-core/autocheck-json-smoke.php
          php .github/tests/taxocommerce-core/autocheck-json-smoke.php download | php .github/tests/taxocommerce-core/autocheck-json-smoke.php validate
          php .github/tests/taxocommerce-core/autocheck-native-menus-smoke.php
          php -l .github/tests/taxocommerce-core/autocheck-relations-smoke.php
          php .github/tests/taxocommerce-core/autocheck-relations-smoke.php
          php .github/tests/taxocommerce-core/country-scope-smoke.php
          php .github/tests/taxocommerce-core/menu-page-countries-smoke.php
          php .github/tests/taxocommerce-core/menu-editor-smoke.php
          php .github/tests/taxocommerce-core/hierarchy-country-schema-smoke.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-content-manager.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-editor-ui.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-architecture-report.php
          php -l .github/tests/taxocommerce-core/category-hierarchy-native-smoke.php
          php .github/tests/taxocommerce-core/category-hierarchy-native-smoke.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-block-navigation.php
          php .github/tests/taxocommerce-core/anomalies-configured-smoke.php
          php .github/tests/taxocommerce-core/block-navigation-smoke.php
          php .github/tests/taxocommerce-core/sidebar-plugins-smoke.php
          php .github/tests/taxocommerce-core/block-navigation-editor-ui-smoke.php
          php .github/tests/taxocommerce-core/architecture-report-smoke.php
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php standalone
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php core-before
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php core-after

  plan:
    name: Select changed deployable plugin files
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.changed.outputs.base }}
      slugs: ${{ steps.changed.outputs.slugs }}
      count: ${{ steps.changed.outputs.count }}
      core: ${{ steps.changed.outputs.core }}
      sync: ${{ steps.changed.outputs.sync }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare against latest verified successful staging release
        id: changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAXOCOMMERCE_FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync && '1' || '0' }}
        run: python3 .github/scripts/deploy_staging_delta.py plan

  deploy-staging:
    name: STAGING / ${{ matrix.slug }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload only changed files to STAGING using shared FTPS login
        # Account root: /home/hosting160568eu/public_html
        # Target path: ./staging.distribuidordeherramientas.es/wp-content/plugins/<slug>/
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          BASE: ${{ needs.plan.outputs.base }}
          SLUG: ${{ matrix.slug }}
          SYNC: ${{ needs.plan.outputs.sync }}
        run: python3 .github/scripts/deploy_staging_delta.py deploy --base "$BASE" --target staging --slug "$SLUG" --full "$SYNC"

  deploy-focazul:
    name: Focazul / ${{ matrix.slug }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload verified changed plugin files to Focazul
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          BASE: ${{ needs.plan.outputs.base }}
          SLUG: ${{ matrix.slug }}
          SYNC: ${{ needs.plan.outputs.sync }}
        run: python3 .github/scripts/deploy_staging_delta.py deploy --base "$BASE" --target focazul --slug "$SLUG" --full "$SYNC"

  verify:
    name: Require successful delivery to every applicable site
    needs: [plan, deploy-staging, deploy-focazul]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check results without accepting partial success
        env:
          PLAN: ${{ needs.plan.result }}
          COUNT: ${{ needs.plan.outputs.count }}
          CORE: ${{ needs.plan.outputs.core }}
          STAGING: ${{ needs.deploy-staging.result }}
          FOCAZUL: ${{ needs.deploy-focazul.result }}
        run: |
          set -euo pipefail
          echo "Plan: $PLAN; plugin changes: $COUNT; Core changed: $CORE"
          echo "STAGING: $STAGING; Focazul: $FOCAZUL"
          test "$PLAN" = "success"
          if [ "$COUNT" != "0" ]; then
            test "$STAGING" = "success"
          fi
          if [ "$COUNT" != "0" ]; then
            test "$FOCAZUL" = "success"
          fi
          echo "All applicable deployments completed successfully"
      - uses: actions/checkout@v4
      - name: Verify and repair tracked Core file parity on both installations
        if: needs.plan.outputs.core == 'true'
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: python3 .github/scripts/deploy_staging_delta.py reconcile-core
      - name: Audit WordPress MO catalogues on STAGING after Core delivery
        if: needs.plan.outputs.core == 'true'
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: python3 .github/scripts/audit_staging_mo.py
      - name: Read-only comparison of Core and both WordPress menus (no site writes)
        # Audit findings stay visible in the summary/artifact; transient HTTP/FTPS
        # failures must not invalidate the verified delivery baseline used by deploy.
        continue-on-error: true
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          TC_STAGING_WP_USER: ${{ secrets.TC_STAGING_WP_USER }}
          TC_STAGING_WP_PASSWORD: ${{ secrets.TC_STAGING_WP_PASSWORD }}
          TC_FOCAZUL_WP_USER: ${{ secrets.TC_FOCAZUL_WP_USER }}
          TC_FOCAZUL_WP_PASSWORD: ${{ secrets.TC_FOCAZUL_WP_PASSWORD }}
        run: python3 .github/scripts/audit_core_dual_sites.py --out core-dual-audit/report
      - name: Preserve cross-site audit report (including failed and unchecked results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-dual-site-audit-${{ github.run_id }}
          path: |
            core-dual-audit/report.json
            core-dual-audit/report.md
          if-no-files-found: ignore
          retention-days: 30

