name: Immediate deployment to STAGING

on:
  workflow_call:
    inputs:
      full_sync:
        description: 'Allow a full reconciliation when called by the gated pipeline'
        required: false
        type: boolean
        default: false
      target_plugin:
        description: 'Optional scoped delivery: taxocommerce-core or taxocommerce-tasks'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Reconciliar todos los plugins instalados (solo manual; normalmente NO)'
        required: false
        type: boolean
        default: false
  # Pushes are handled by the single gated workflow. The prior concurrent
  # scoped Core/Tasks push was incorrectly recorded as a complete release.
  pull_request:
    paths:
      - 'taxocommerce-*/**'
      - '.github/scripts/deploy_staging_delta.py'
      - '.github/tests/test_pro_historic_modular_workflow.py'
      - '.github/workflows/despliege_de_main_a_pro.yml'
      - '.github/tests/test_deploy_staging_delta.py'
      - '.github/scripts/audit_core_dual_sites.py'
      - '.github/tests/test_audit_core_dual_sites.py'
      - '.github/tests/test_staging_check_subida_a_pro.py'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/staging_check_subida_a_pro.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: taxocommerce-staging-focazul-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate incremental deployment and Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate System Check native code audit independently
        run: |
          set -euo pipefail
          php -l taxocommerce-system-check/includes/class-taxocommerce-system-check-code-rules.php
          php -l taxocommerce-system-check/includes/class-taxocommerce-system-check-code-check.php
          php -l taxocommerce-system-check/tests/code-check-deep-smoke.php
          php taxocommerce-system-check/tests/code-check-deep-smoke.php
          php taxocommerce-system-check/tests/code-check-smoke.php

      - name: Validate independent Autotest Code Check for the entire new family
        run: |
          set -euo pipefail
          for plugin in auditor campaigns core customers database dependiente distribution facturacion faqs google-bing images import-export logistica redirects scrappers social suppliers tasks templates vocabulary; do
            php -l "taxocommerce-${plugin}/includes/class-taxocommerce-autotest-code.php"
            php .github/tests/autotest-code-vendor-smoke.php "${plugin}"
            node --check "taxocommerce-${plugin}/assets/autotest-code.js"
          done
          php -l .github/tests/autotest-family-tabs-smoke.php
          php .github/tests/autotest-family-tabs-smoke.php
          php -l taxocommerce-system-check/taxocommerce-system-check.php
          php -l taxocommerce-system-check/includes/class-taxocommerce-system-check-auto-test.php
          php -l taxocommerce-system-check/includes/class-taxocommerce-system-check-code-check.php
          php taxocommerce-system-check/tests/code-check-smoke.php
          php taxocommerce-system-check/tests/auto-test-guide-smoke.php

      - name: Validate Insights consent and editable legal text lifecycle
        run: |
          php -l taxocommerce-google-bing/includes/class-taxocommerce-insights-consent.php
          php taxocommerce-google-bing/tests/consent-smoke.php
          php -l taxocommerce-google-bing/includes/class-taxocommerce-insights-consent-seed.php
          php -l taxocommerce-google-bing/tests/consent-wpoptions-seed-smoke.php
          php taxocommerce-google-bing/tests/consent-wpoptions-seed-smoke.php
          php -l taxocommerce-google-bing/tests/consent-json-import-smoke.php
          php taxocommerce-google-bing/tests/consent-json-import-smoke.php
          node --check taxocommerce-google-bing/assets/consent.js
      - name: Validate delta script and regression tests
        run: |
          python3 -m py_compile .github/scripts/deploy_staging_delta.py
          python3 -m unittest discover -s .github/tests -p test_deploy_staging_delta.py -v
          python3 -m unittest discover -s .github/tests -p test_pro_historic_modular_workflow.py -v
          python3 -m unittest discover -s .github/tests -p test_select_pro_release_delta.py -v
          python3 -m unittest discover -s .github/tests -p test_staging_check_subida_a_pro.py -v
          python3 -m unittest discover -s .github/tests -p test_insights_head_tags_bootstrap.py -v
          python3 -m py_compile .github/scripts/audit_core_dual_sites.py
          python3 -m unittest discover -s .github/tests -p test_audit_core_dual_sites.py -v
      - name: Verify all 20 Autocheck JSON contracts and PHP syntax
        run: |
          set -euo pipefail
          php -l .github/tests/legacy-scrappers-coexistence-smoke.php
          php .github/tests/legacy-scrappers-coexistence-smoke.php
          php -l .github/tests/legacy-loaders-smoke.php
          php .github/tests/legacy-loaders-smoke.php
          php -l includes/ojeador/class-ojeador-admin.php
          php -l .github/tests/legacy-ojeador-allowlist-smoke.php
          php .github/tests/legacy-ojeador-allowlist-smoke.php
          php -l taxocommerce-dependiente/tests/i18n-catalog-smoke.php
          php taxocommerce-dependiente/tests/i18n-catalog-smoke.php
          for entry in bootstrap.php seo-marketing.php includes/header.php includes/dependiente/clonador/clonador-bootstrap.php; do php -l "$entry"; done
          php -l .github/tests/i18n-19-locale-smoke.php
          php .github/tests/i18n-19-locale-smoke.php
          python3 .github/scripts/sync_family_admin_branding.py --check
          php -l .github/tests/family-admin-header-smoke.php
          php .github/tests/family-admin-header-smoke.php
          php -l .github/tests/taxocommerce-autocheck-family.php
          php .github/tests/taxocommerce-autocheck-family.php
          find taxocommerce-* -type f -name '*.php' -not -path '*/tests/*' -not -path '*/templates/*' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done
          php taxocommerce-auditor/tests/auto-test-manual-smoke.php
          php taxocommerce-database/tests/auto-test-smoke.php
          php -l .github/tests/early-i18n-core-registration-smoke.php
          for slug in vocabulary auditor database scrappers; do php .github/tests/early-i18n-core-registration-smoke.php "$slug"; done
          php -l taxocommerce-tasks/includes/class-tctasks-manuals.php
          php -l taxocommerce-tasks/tests/standalone-bootstrap-smoke.php
          php taxocommerce-tasks/tests/standalone-bootstrap-smoke.php
          php -l taxocommerce-customers/tests/standalone-bootstrap-smoke.php
          php taxocommerce-customers/tests/standalone-bootstrap-smoke.php
          node --check taxocommerce-customers/assets/admin.js
          php -l taxocommerce-tasks/includes/class-tctasks-calendar.php
          php -l taxocommerce-tasks/tests/calendar-duration-smoke.php
          php taxocommerce-tasks/tests/calendar-duration-smoke.php
          php taxocommerce-system-check/tests/processes-smoke.php
          php -l taxocommerce-system-check/includes/class-taxocommerce-system-check-code-check.php
          php -l taxocommerce-system-check/includes/class-taxocommerce-system-check-code-rules.php
          php -l taxocommerce-system-check/tests/code-check-deep-smoke.php
          php taxocommerce-system-check/tests/code-check-deep-smoke.php
          php -l taxocommerce-system-check/tests/code-check-smoke.php
          php taxocommerce-system-check/tests/code-check-smoke.php
          node --check taxocommerce-system-check/assets/code-check.js
          php taxocommerce-dependiente/tests/auto-test-smoke.php
          php -l taxocommerce-dependiente/tests/clean-install-smoke.php
          php taxocommerce-dependiente/tests/clean-install-smoke.php
          php -l taxocommerce-dependiente/tests/first-install-catalog-smoke.php
          php taxocommerce-dependiente/tests/first-install-catalog-smoke.php
          php -l taxocommerce-dependiente/tests/no-products-runtime-smoke.php
          php taxocommerce-dependiente/tests/no-products-runtime-smoke.php
          php -l taxocommerce-dependiente/tests/empty-lesson-progression-smoke.php
          php taxocommerce-dependiente/tests/empty-lesson-progression-smoke.php
          php -l taxocommerce-dependiente/tests/optional-sources-empty-smoke.php
          php taxocommerce-dependiente/tests/optional-sources-empty-smoke.php
          php -l taxocommerce-dependiente/tests/m11-checkpoint-large-lexicon.php
          php taxocommerce-dependiente/tests/m11-checkpoint-large-lexicon.php
          php taxocommerce-distribution/tests/manual-autocheck-smoke.php
          php taxocommerce-facturacion/tests/manual-autotest-smoke.php
          php taxocommerce-faqs/tests/auto-test-smoke.php
          php taxocommerce-google-bing/tests/auto-test-smoke.php
          php taxocommerce-google-bing/tests/head-tags-smoke.php
          php taxocommerce-google-bing/tests/head-tags-inventory-smoke.php
          php taxocommerce-google-bing/tests/ecommerce-smoke.php
          php taxocommerce-google-bing/tests/cloudflare-migration-smoke.php
          php -l taxocommerce-google-bing/includes/class-taxocommerce-insights-consent.php
          php taxocommerce-google-bing/tests/consent-smoke.php
          php taxocommerce-google-bing/tests/analysis-standalone-smoke.php
          php -l taxocommerce-google-bing/includes/class-taxocommerce-google-bing-gsc-sync-bridge.php
          php -l taxocommerce-google-bing/includes/class-taxocommerce-google-bing-google-service.php
          php taxocommerce-google-bing/tests/gsc-sync-bridge-smoke.php
          php taxocommerce-google-bing/tests/analysis-unified-smoke.php
          php -l taxocommerce-google-bing/tests/analysis-mobile-smoke.php
          php taxocommerce-google-bing/tests/analysis-mobile-smoke.php
          php -l taxocommerce-google-bing/tests/analysis-chunked-json-smoke.php
          php taxocommerce-google-bing/tests/analysis-chunked-json-smoke.php
          node --check taxocommerce-google-bing/includes/analysis/assets/analista-lazy.js
          php taxocommerce-google-bing/tests/geo-bridge-smoke.php
          node taxocommerce-google-bing/tests/head-tags-browser-smoke.js
          php taxocommerce-google-bing/tests/indexnow-smoke.php
          php taxocommerce-google-bing/tests/indexnow-i18n-smoke.php
          php taxocommerce-images/tests/auto-test-smoke.php
          php -l taxocommerce-images/includes/class-taxocommerce-autotest-code.php
          php taxocommerce-images/tests/code-check-smoke.php
          node --check taxocommerce-images/assets/autotest-code.js
          php taxocommerce-import-export/tests/auto-test-smoke.php
          php taxocommerce-logistica/tests/auto-test-smoke.php
          php taxocommerce-redirects/tests/auto-test-smoke.php
          php -l taxocommerce-redirects/tests/opnv-redirects-owner-smoke.php
          php taxocommerce-redirects/tests/opnv-redirects-owner-smoke.php
          php taxocommerce-scrappers/tests/manual-autotest-smoke.php
          php -l taxocommerce-scrappers/tests/lifecycle-smoke.php
          php taxocommerce-scrappers/tests/lifecycle-smoke.php
          php taxocommerce-social/tests/auto-test-manual-smoke.php
          php -l taxocommerce-social/includes/calendar.php
          php -l taxocommerce-social/tests/calendar-edit-cancel-smoke.php
          php taxocommerce-social/tests/calendar-edit-cancel-smoke.php
          php -l taxocommerce-social/includes/csv-cancel.php
          php -l taxocommerce-social/tests/csv-cancel-smoke.php
          php taxocommerce-social/tests/csv-cancel-smoke.php
          php -l taxocommerce-accounting/taxocommerce-accounting.php
          php -l taxocommerce-accounting/tests/standalone-bootstrap-smoke.php
          php taxocommerce-accounting/tests/standalone-bootstrap-smoke.php
          python3 -m py_compile .github/scripts/activate_accounting_staging.py
          php taxocommerce-suppliers/tests/smoke.php
          php taxocommerce-suppliers/tests/template-creation-smoke.php
          php taxocommerce-system-check/tests/auto-test-guide-smoke.php
          php taxocommerce-templates/tests/smoke.php
          php -l taxocommerce-templates/tests/cookie-footer-smoke.php
          php taxocommerce-templates/tests/cookie-footer-smoke.php
          node --check taxocommerce-templates/assets/footer-cookie-preferences.js
          php taxocommerce-templates/tests/bing-meta-head-smoke.php
          php taxocommerce-templates/tests/international-pilot-seo-head-smoke.php
          php taxocommerce-templates/tests/bing-title-home-alt-smoke.php
          php taxocommerce-templates/tests/manual-smoke.php
          php -l taxocommerce-templates/tests/filesystem-smoke.php
          php taxocommerce-templates/tests/filesystem-smoke.php
          find taxocommerce-templates/templates -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done
          php -l taxocommerce-templates/tests/sql-identifiers-smoke.php
          php taxocommerce-templates/tests/sql-identifiers-smoke.php
          php -l taxocommerce-templates/tests/plugincheck-warnings-smoke.php
          php taxocommerce-templates/tests/plugincheck-warnings-smoke.php
          php taxocommerce-vocabulary/tests/auto-test-manual-smoke.php
          php -l taxocommerce-vocabulary/includes/class-tcv-extractor.php
          php -l taxocommerce-vocabulary/tests/classifier-extraction-smoke.php
          php taxocommerce-vocabulary/tests/classifier-extraction-smoke.php
      - name: Import-Export native category CSV contracts and PHP syntax
        run: |
          php -l taxocommerce-import-export/includes/class-taxocommerce-import-export-csv.php
          php -l taxocommerce-import-export/includes/class-taxocommerce-import-export-exporter.php
          php -l taxocommerce-import-export/includes/class-taxocommerce-import-export-batch.php
          php -l taxocommerce-import-export/includes/class-taxocommerce-import-export-auto-test.php
          php -l taxocommerce-import-export/tests/i18n-empty-mo-smoke.php
          php taxocommerce-import-export/tests/i18n-empty-mo-smoke.php
          php -l taxocommerce-import-export/includes/class-taxocommerce-ie-gettext-fallback.php
          php -l taxocommerce-import-export/tests/empty-gettext-fallback-smoke.php
          php taxocommerce-import-export/tests/empty-gettext-fallback-smoke.php
          php taxocommerce-import-export/tests/native-category-csv-smoke.php
          php taxocommerce-import-export/tests/country-csv-smoke.php
          php taxocommerce-import-export/tests/batch-queue-smoke.php
          node --check taxocommerce-import-export/assets/exporter.js
      - name: Validate all TaxoCommerce binary gettext catalogs
        run: |
          python3 -m unittest discover -s .github/tests -p test_verify_mo_catalogs.py -v
          python3 .github/scripts/verify_mo_catalogs.py --repo
      - name: Core PHP syntax and regression tests
        run: |
          php -l taxocommerce-core/taxocommerce-core.php
          php -l taxocommerce-core/tests/action-scheduler-notice-smoke.php
          php taxocommerce-core/tests/action-scheduler-notice-smoke.php
          php -l taxocommerce-core/includes/class-taxocommerce-core.php
          php -l taxocommerce-core/tests/family-extension-discovery-smoke.php
          php taxocommerce-core/tests/family-extension-discovery-smoke.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-anomalies.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-country.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-hierarchy.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-hierarchy-classic.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-menu.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-menu-editor.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-auto-test.php
          php -l .github/tests/taxocommerce-core/autocheck-json-smoke.php
          php -l taxocommerce-distribution/includes/sitemaps/batch-worker.php
          php -l taxocommerce-distribution/includes/sitemaps/engine.php
          php -l taxocommerce-distribution/includes/admin.php
          php -l taxocommerce-distribution/tests/sitemap-publish-state-smoke.php
          php taxocommerce-distribution/tests/sitemap-publish-state-smoke.php
          php -l taxocommerce-distribution/tests/sitemap-daily-smoke.php
          php taxocommerce-distribution/tests/sitemap-daily-smoke.php
          php taxocommerce-distribution/tests/sitemap-daily-smoke.php legacy
          php -l taxocommerce-distribution/tests/opnv-sitemap-owner-smoke.php
          php taxocommerce-distribution/tests/opnv-sitemap-owner-smoke.php
          php taxocommerce-distribution/tests/opnv-sitemap-owner-smoke.php legacy
          php .github/tests/taxocommerce-core/auto-test-smoke.php
          php -l .github/tests/taxocommerce-core/autocheck-functional-smoke.php
          php .github/tests/taxocommerce-core/autocheck-functional-smoke.php
          php .github/tests/taxocommerce-core/autocheck-json-smoke.php
          php .github/tests/taxocommerce-core/autocheck-json-smoke.php download | php .github/tests/taxocommerce-core/autocheck-json-smoke.php validate
          php .github/tests/taxocommerce-core/autocheck-native-menus-smoke.php
          php -l .github/tests/taxocommerce-core/autocheck-relations-smoke.php
          php .github/tests/taxocommerce-core/autocheck-relations-smoke.php
          php .github/tests/taxocommerce-core/country-scope-smoke.php
          php .github/tests/taxocommerce-core/menu-page-countries-smoke.php
          php .github/tests/taxocommerce-core/menu-editor-smoke.php
          php .github/tests/taxocommerce-core/hierarchy-country-schema-smoke.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-content-manager.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-editor-ui.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-architecture-report.php
          php -l .github/tests/taxocommerce-core/category-hierarchy-native-smoke.php
          php .github/tests/taxocommerce-core/category-hierarchy-native-smoke.php
          php -l taxocommerce-core/includes/class-taxocommerce-core-block-navigation.php
          php .github/tests/taxocommerce-core/anomalies-configured-smoke.php
          php taxocommerce-core/tests/anomalies-complete-json-smoke.php
          php .github/tests/taxocommerce-core/block-navigation-smoke.php
          php .github/tests/taxocommerce-core/sidebar-plugins-smoke.php
          php .github/tests/taxocommerce-core/official-info-static-smoke.php
          php .github/tests/taxocommerce-core/uninstall-excerpt-smoke.php
          php -l .github/tests/taxocommerce-core/family-catalog-availability-smoke.php
          php .github/tests/taxocommerce-core/family-catalog-availability-smoke.php
          php .github/tests/taxocommerce-core/block-navigation-editor-ui-smoke.php
          php .github/tests/taxocommerce-core/architecture-report-smoke.php
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php standalone
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php core-before
          php taxocommerce-redirects/tests/core-extension-menu-smoke.php core-after

  plan:
    name: Select changed deployable plugin files
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.changed.outputs.base }}
      slugs: ${{ steps.changed.outputs.slugs }}
      count: ${{ steps.changed.outputs.count }}
      core: ${{ steps.changed.outputs.core }}
      sync: ${{ steps.changed.outputs.sync }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare against latest verified successful staging release
        id: changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAXOCOMMERCE_FULL_SYNC: ${{ inputs.full_sync && '1' || '0' }}
          # Never mistake the last successful *partial* job for a verified
          # whole-family release; inspect installed entrypoints on both sites.
          TAXOCOMMERCE_REMOTE_VERIFY: '1'
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          # Called workflows inherit the caller's github event. Scope only a
          # direct workflow push, not the standard gated reusable workflow.
          TAXOCOMMERCE_TARGET_PLUGIN: ${{ inputs.target_plugin || '' }}
        run: python3 .github/scripts/deploy_staging_delta.py plan

  deploy-staging:
    name: STAGING / ${{ matrix.slug }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload only changed files to STAGING using shared FTPS login
        # Account root: /home/hosting160568eu/public_html
        # Target path: ./staging.distribuidordeherramientas.es/wp-content/plugins/<slug>/
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          BASE: ${{ needs.plan.outputs.base }}
          SLUG: ${{ matrix.slug }}
          SYNC: ${{ needs.plan.outputs.sync }}
          TAXOCOMMERCE_TARGET_PLUGIN: ${{ inputs.target_plugin || '' }}
        # deploy() has a bounded 3-attempt reconnect loop; never retry it 3x in bash.
        # Unbuffered output records progress and the actual failing FTPS phase.
        run: python3 -u .github/scripts/deploy_staging_delta.py deploy --base "$BASE" --target staging --slug "$SLUG" --full "$SYNC"
      - name: Activate and verify new Accounting plugin on STAGING only
        if: ${{ matrix.slug == 'taxocommerce-accounting' }}
        env:
          TC_STAGING_WP_USER: ${{ secrets.TC_STAGING_WP_USER }}
          TC_STAGING_WP_PASSWORD: ${{ secrets.TC_STAGING_WP_PASSWORD }}
        run: python3 .github/scripts/activate_accounting_staging.py

  deploy-focazul:
    name: Focazul / ${{ matrix.slug }}
    # Both sites use the same FTP service. Finish STAGING connections first.
    # always() still runs Focazul when STAGING fails (separate failure reporting).
    needs: [plan, deploy-staging]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload verified changed plugin files to Focazul
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          BASE: ${{ needs.plan.outputs.base }}
          SLUG: ${{ matrix.slug }}
          SYNC: ${{ needs.plan.outputs.sync }}
          TAXOCOMMERCE_TARGET_PLUGIN: ${{ inputs.target_plugin || '' }}
        # deploy() has a bounded 3-attempt reconnect loop; never retry it 3x in bash.
        # Unbuffered output records progress and the actual failing FTPS phase.
        run: python3 -u .github/scripts/deploy_staging_delta.py deploy --base "$BASE" --target focazul --slug "$SLUG" --full "$SYNC"

  verify:
    name: Require successful delivery to every applicable site
    needs: [plan, deploy-staging, deploy-focazul]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check results without accepting partial success
        env:
          PLAN: ${{ needs.plan.result }}
          COUNT: ${{ needs.plan.outputs.count }}
          CORE: ${{ needs.plan.outputs.core }}
          STAGING: ${{ needs.deploy-staging.result }}
          FOCAZUL: ${{ needs.deploy-focazul.result }}
        run: |
          set -euo pipefail
          echo "Plan: $PLAN; plugin changes: $COUNT; Core changed: $CORE"
          echo "STAGING: $STAGING; Focazul: $FOCAZUL"
          test "$PLAN" = "success"
          if [ "$COUNT" != "0" ]; then
            test "$STAGING" = "success"
          fi
          if [ "$COUNT" != "0" ]; then
            test "$FOCAZUL" = "success"
          fi
          echo "All applicable deployments completed successfully"
      - uses: actions/checkout@v4
      - name: Verify and repair tracked Core file parity on both installations
        if: needs.plan.outputs.core == 'true'
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: python3 .github/scripts/deploy_staging_delta.py reconcile-core
      - name: Audit WordPress MO catalogues on STAGING after Core delivery
        if: needs.plan.outputs.core == 'true'
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: python3 .github/scripts/audit_staging_mo.py
      - name: Read-only comparison of Core and both WordPress menus (no site writes)
        # Audit findings stay visible in the summary/artifact; transient HTTP/FTPS
        # failures must not invalidate the verified delivery baseline used by deploy.
        continue-on-error: true
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          TC_STAGING_WP_USER: ${{ secrets.TC_STAGING_WP_USER }}
          TC_STAGING_WP_PASSWORD: ${{ secrets.TC_STAGING_WP_PASSWORD }}
          TC_FOCAZUL_WP_USER: ${{ secrets.TC_FOCAZUL_WP_USER }}
          TC_FOCAZUL_WP_PASSWORD: ${{ secrets.TC_FOCAZUL_WP_PASSWORD }}
        run: python3 .github/scripts/audit_core_dual_sites.py --out core-dual-audit/report
      - name: Preserve cross-site audit report (including failed and unchecked results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-dual-site-audit-${{ github.run_id }}
          path: |
            core-dual-audit/report.json
            core-dual-audit/report.md
          if-no-files-found: ignore
          retention-days: 30

