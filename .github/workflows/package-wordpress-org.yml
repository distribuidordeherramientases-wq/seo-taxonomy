name: Build WordPress.org Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean plugin tree
        run: |
          rm -rf build
          mkdir -p build/taxocommerce-seo
          rsync -a \
            --exclude='.git/' \
            --exclude='.*' \
            --exclude='.github/' \
            --exclude='build/' \
            --exclude='/taxocommerce-core/' \
            --exclude='/taxocommerce-images/' \
            --exclude='/taxocommerce-import-export/' \
            --exclude='/taxocommerce-system-check/' \
            --exclude='/taxocommerce-faqs/' \
            --exclude='/taxocommerce-vocabulary/' \
            --exclude='/packages/' \
            --exclude='docs/' \
            --exclude='CONTRIBUTING.md' \
            --exclude='README.md' \
            --exclude='SUPPLIER-SYNC-V2.md' \
            ./ build/taxocommerce-seo/

      - name: Create ZIP
        working-directory: build
        run: zip -qr taxocommerce-seo.zip taxocommerce-seo

      - name: Upload WordPress.org package
        uses: actions/upload-artifact@v4
        with:
          name: taxocommerce-seo-wordpress-org-${{ github.sha }}
          path: build/taxocommerce-seo.zip
          if-no-files-found: error
          retention-days: 14
