name: TaxoCommerce Database - validation

on:
  pull_request:
    paths:
      - 'taxocommerce-database/**'
      - '.github/workflows/taxocommerce-database.yml'
  push:
    branches:
      - staging
    paths:
      - 'taxocommerce-database/**'
      - '.github/workflows/taxocommerce-database.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Validate plugin syntax
        run: find taxocommerce-database -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify both original services
        run: |
          php taxocommerce-database/tests/legacy-clean-db-smoke.php
          php taxocommerce-database/tests/legacy-data-table-smoke.php
          php taxocommerce-database/tests/menu-smoke.php alone
          php taxocommerce-database/tests/menu-smoke.php core
          php taxocommerce-database/tests/auto-test-smoke.php
      - name: Assert no invented services or Data Layer
        run: |
          set -euo pipefail
          test -f taxocommerce-database/includes/legacy/seo-database-clean.php
          test -f taxocommerce-database/includes/legacy/seo-database-report.php
          test ! -e taxocommerce-database/includes/class-tcdb-admin.php
          test ! -e taxocommerce-database/includes/class-tcdb-import.php
          test ! -e taxocommerce-database/includes/class-tcdb-maintenance.php
          ! grep -R -nE 'SEO_Data_Layer|SEO_Data_Rollback|TCDB_Journal|admin_post_tcdb_rollback' taxocommerce-database/includes/ taxocommerce-database/taxocommerce-database.php
