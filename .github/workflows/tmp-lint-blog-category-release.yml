name: Temporal lint blog category release

on:
  push:
    branches:
      - release/blog-category-template-pro

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l includes/template-loader.php
          php -l includes/template-manager.php
          php -l seo-system/templates/template-blog.php
          php -l seo-system/templates/template-blog-desktop.php
          php -l seo-system/templates/template-blog-mobile.php
          php -l seo-system/templates/template-blog-category.php
          php -l seo-system/templates/template-blog-category-desktop.php
          php -l seo-system/templates/template-blog-category-mobile.php
