name: Copiar STAGING a PRO (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: taxocommerce-production-deploy
  cancel-in-progress: false
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 0
      - name: Copiar cambios de staging a PRO
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 .github/scripts/select_pro_release_delta.py --all-changed --output "$RUNNER_TEMP/pro-changes.json"
          python3 .github/scripts/deploy_pro_ftps_native.py "$RUNNER_TEMP/pro-changes.json"
