name: Copiar STAGING a PRO (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taxocommerce-production-deploy
  cancel-in-progress: false
jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 0
      - name: Sincronizar todos los plugins desde staging a PRO
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 .github/scripts/deploy_pro_simple.py
